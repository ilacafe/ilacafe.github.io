<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8D6E52">
    <title>ILA | Inventory</title>
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- THE TWO HOSTS THE BROWSER FINDS OUT ABOUT LAST
         A connection to a new host costs a DNS lookup, a TCP handshake and a TLS
         handshake before a single byte of what was asked for comes back — on café
         wifi, a good fraction of a second. The browser starts that work the moment
         it SEES a host, and it cannot see either of these until late:

           fonts.gstatic.com appears nowhere in this file. It is named inside the
           Google Fonts stylesheet below, so the browser only learns it exists once
           that stylesheet has been fetched and parsed, and only then starts a
           connection for the font files themselves.

           the database is worse. Its host is in firebaseConfig, at the foot of the
           page, and nothing connects to it until the SDK below has downloaded,
           parsed and run. That handshake happens after all of it, in series, while
           the page sits there with nothing on it.

         A preconnect names them here, at the top, so both handshakes happen early
         and alongside everything else rather than after it. crossorigin is required
         on the font one: fonts are fetched anonymously, and a preconnect whose mode
         does not match the request is a connection the browser throws away.

         Nothing else here needs one: every other host is named directly by a tag
         below, which is already the earliest the browser could possibly know. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app">
    <!-- LOADED WITHOUT BLOCKING THE FIRST PAINT
         With the SDK moved out of the head, this one-kilobyte stylesheet was the
         only thing left up here that could stop the page being drawn — and it
         stopped it for a whole round trip to another origin. Measured on a cold
         open with the font server answering in 800ms, first paint was ~890ms: the
         page was ready and waiting on this the entire time.

         media="print" means it does not apply to the screen, so the browser will
         not hold the paint for it; the onload swaps it to all as soon as it lands.
         Nothing is lost by that, because the URL already asks for display=swap —
         text was ALWAYS going to be drawn in the fallback face first and re-drawn
         in Quicksand when the font arrived. This only stops the rest of the page
         waiting for that to be arranged.

         The <noscript> copy keeps the ordinary behaviour where onload can never
         fire. These pages need JavaScript for anything at all, so it changes
         nothing in practice, but a stylesheet that silently depends on script is
         not a thing to leave unsaid. -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
    
    <!-- PRELOADED HERE, RUN AT THE FOOT OF THE PAGE
         These three bundles are the better part of 400KB of JavaScript to compile,
         and they used to sit right here as ordinary script tags. A script tag in
         the head stops the parser dead: nothing below it is looked at, let alone
         painted, until the file has both arrived AND been compiled. So on a cold
         open the till, the kitchen screen and the customer's phone each showed a
         blank page for the whole of that — with the markup for the page they were
         waiting on sitting ready, unparsed, a few lines further down.

         The tags now sit at the foot of the body, directly above this page's own
         script, which is the last thing in the document. Same three files, same
         order, still ordinary synchronous tags — so `firebase` is defined before a
         line of page code runs, exactly as it was. What changed is only that the
         browser is allowed to parse and paint the page first.

         The preloads are the other half of it, and leaving them out would make
         this SLOWER rather than faster: a tag at the foot of the body is not
         DISCOVERED until the parser gets there, so the download would start late
         and the page would become usable later than it does today. rel=preload
         names the files up here, where the tags used to be, so the fetch begins at
         the same moment it always did, running alongside the parse rather than
         in place of it.

         crossorigin and integrity are repeated from the tags deliberately. A
         preload is only reused for a later request when the mode and the integrity
         metadata match it; if they do not, the browser fetches the same file
         twice, which is worse than never having preloaded it. -->
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"
          integrity="sha384-rGbwvB6k85I5jkhcy5vYOSdABhBKcD9CHXb0RJIIuxMYVZatT6uul1faR/C5QI1U">
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"
          integrity="sha384-DVRvWnCIBtUIWOm6GpD+wukXwI8nijglXsBFYMlBIOgL5qBHlB8sa1CUlOftmd0R">
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"
          integrity="sha384-FlKYNHBedwGFdcKg5PNKA38dWBcbf9RzKO4qBmxO3DaDw5yuYP0DXikg/fgj4xID">

    <!-- Ours, named here and run at the foot alongside the SDK.
         These are a few kilobytes each, which is not the point: the head is where
         a browser decides whether it may draw the page yet, and a synchronous
         script sitting in it means the answer is no, however small the file. They
         are named up here so the fetch still starts at the same moment, then run
         where they no longer hold anything up.

         Deferring them instead would be simpler and does not work. The page's own
         script calls into each of these on its first pass, and a deferred script
         does not run until after the parser has finished — which is after that
         call has already been made and already failed.

         No crossorigin on these, unlike the SDK preloads above: they are
         same-origin and fetched in that mode by default, so declaring it would
         stop the preload matching the tag and fetch each file twice. -->
    <link rel="preload" as="script" href="/auth-gate.js">
    <link rel="preload" as="script" href="/pin-mask.js">
    <link rel="preload" as="script" href="/dialogs.js">
    <link rel="preload" as="script" href="/connection.js">

    <style>
        :root { --brand-bg: #8D6E52; --brand-text: #ffffff; }
        #login-overlay { position: fixed; inset: 0; background: var(--brand-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #login-overlay.hidden { display: none; }
        #login-box { width: 100%; max-width: 320px; text-align: center; }
        #login-box h2 { letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 25px; }
        #login-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff; font-family: 'Quicksand', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; }
        #login-box button { width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px; background: #fff; color: var(--brand-bg); font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        /* THE ONE LINE ON THIS SCREEN THAT HAS TO BE READ
           #ffcfcf on the brand brown is 3.36:1 — under AA, at full opacity, on the
           message that tells someone why they cannot get in.

           No pink fixes that. White is 4.68:1 on this background and everything
           tinted towards red is below it, so the lightest pink that would pass is
           white — which leaves two ways out: put the message on a different surface,
           or stop asking the colour of the text to carry the meaning.

           A panel was tried and is worse. Any box under a sign-in form reads as
           another field of the form, and a tinted one reads as a broken field.

           So the text is white and the red is a rule beside it. The message is legible
           because white passes; it is an error because the mark next to it is red and
           nothing else on this screen has one. Nothing is boxed, nothing is tinted,
           and when there is no error there is nothing there at all. */
        #login-error { color: #fff; font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; text-align: left; }
        #login-error:not(:empty) {
            border-left: 3px solid #ff8f8f; padding: 2px 0 2px 10px; line-height: 1.45;
        }
        /* The brand, on the root as well as the body. Android paints the strip behind
           the home bar and the overscroll gutter from the canvas, and the canvas only
           inherits the body's background while html has none of its own — so on Android
           that area came out white while an iPhone looked seamless. Said in both places
           it cannot be anything else. */
        html { background-color: var(--brand-bg); }
        /* The platform tints these its own blue. accent-color is the whole fix — it
           keeps the native control, its behaviour and its semantics exactly as they
           are, and only says what colour. A hand-built checkbox would have bought the
           same look and a pile of keyboard and screen-reader work to get back to where
           the real one already was. */
        input[type="checkbox"], input[type="radio"], input[type="range"], progress {
            accent-color: var(--brand-text);
        }
        body { background-color: var(--brand-bg); color: var(--brand-text); font-family: 'Quicksand', sans-serif; margin: 0; padding: 0; line-height: 1.6; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }
        /* THESE PAGES OPT INTO DRAWING UNDER THE NOTCH
           viewport-fit=cover in the head says "use the whole screen, including the
           parts hardware sits over". That is worth having on a wall-mounted board —
           and it is only half a decision. The other half is padding the content back
           out of those corners, which nothing here did: on a notched tablet in
           landscape, which is how a kitchen screen is mounted, the left edge of the
           board can sit under the camera housing.

           env() resolves to 0 wherever there is no notch, so this costs nothing on
           the displays that do not have one. */
        .container { width: 100%; max-width: 600px; margin: 0 auto; box-sizing: border-box;
                     padding: calc(15px + env(safe-area-inset-top)) calc(15px + env(safe-area-inset-right)) calc(15px + env(safe-area-inset-bottom)) calc(15px + env(safe-area-inset-left)); }
        
        header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .logo { max-width: min(250px, 78vw); height: auto; display: block; margin: 0 auto; }
        h1 { font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; margin: 10px 0 0 0; }
        
        /* TABS NAV */
        .tab-bar { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab-bar::-webkit-scrollbar { display: none; }
        /* An unselected tab is still a button someone has to read to know where
           they are going. At 0.4 it was 2.04:1. Which one is current is carried by
           weight and the underline it already had, both of which survive being
           looked at across a stock room; opacity did not. */
        /* Six tabs at 15px of side padding came to 584px inside a 570px container,
           so Log — the last one, and the prep and delivery record that nothing showed
           for years — hung off the right edge: clipped, and not tappable without
           scrolling a strip that gives no sign it scrolls. 10px fits all six. */
        .tab-btn { background: transparent; color: white; border: none; font-family: 'Quicksand', sans-serif; font-size: 0.95rem; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; padding: 12px 10px; min-height: 44px; cursor: pointer; transition: border-bottom 0.2s; white-space: nowrap; }
        .tab-btn.active { font-weight: 700; border-bottom: 3px solid white; }

        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        .log-row { border-bottom: 1px solid rgba(255,255,255,0.12); padding: 12px 2px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .log-what { font-weight: 700; }
        .log-who { font-size: 0.85rem; }
        .log-when { font-size: 0.8rem; white-space: nowrap; }
        .log-detail { font-size: 0.8rem; margin-top: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; margin-bottom: 15px; }

        /* GRID BUTTONS */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 35px; }
        .action-btn { background-color: var(--brand-text); color: var(--brand-bg); border: none; padding: 15px 10px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; font-family: 'Quicksand', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.1s; min-height: 80px;}
        .action-btn:active { transform: scale(0.97); }
        .action-btn.outline { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255,255,255,0.4); box-shadow: none; }
        
        .stock-badge { font-size: 0.75rem; font-weight: normal; margin-top: 5px; background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 12px; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: flex-start; padding-top: 10vh; box-sizing: border-box; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        /* CLOSED MODALS ARE NOT LAID OUT
           These overlays are hidden with opacity rather than display, so that they
           can fade. The cost of that is that every one of them is still a rendered
           box with a rendered subtree: on the till, fourteen closed modals were
           being laid out on the first paint and again on every reflow after it.
           Measured at 4x CPU throttle, pos.html spent 136ms in layout against
           32ms for a kitchen screen — the till's slow open was never its 250KB of
           script (143ms, less than the kitchen screen's) but its markup.

           content-visibility:hidden skips layout and paint for the CONTENTS while
           leaving the overlay's own box alone, so the opacity transition still
           runs exactly as before and nothing moves. The subtree is laid out when
           the modal is opened, which is the moment somebody is waiting for it
           rather than the moment they are waiting for the till.

           A browser too old to know the property ignores it and lays everything
           out as it did — slower, never wrong. */
        .modal-overlay { content-visibility: hidden; }
        .modal-overlay.active { content-visibility: visible; }
        .modal-content { background-color: var(--brand-bg); border: 1px solid rgba(255,255,255,0.2); padding: 25px 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        .modal-title { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 5px; }
        .modal-subtitle { font-size: 0.85rem; margin-bottom: 20px; font-style: italic; }

        .remark-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); font-family: 'Quicksand', sans-serif; font-size: 1.1rem; background-color: rgba(0,0,0,0.1); color: white; display: block; box-sizing: border-box; outline: none; text-align: center; font-weight: bold;}
        .remark-input::placeholder { color: rgba(255,255,255,0.4); font-weight: normal; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; font-family: 'Quicksand', sans-serif; text-transform: uppercase; border: none; letter-spacing: 1px;}
        .btn-primary { background-color: var(--brand-text); color: var(--brand-bg); }
        .btn-secondary { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255,255,255,0.4); }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: white; color: var(--brand-bg); padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 0.9rem; transition: transform 0.3s ease; z-index: 3000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); white-space: nowrap; pointer-events: none;}
        #toast.show { transform: translateX(-50%) translateY(0); }

        /* SOMETHING TO SEE WHEN YOU TAB
           The sign-in box sets outline:none on both of its fields, and nothing replaced
           it. Staff sign these tablets in with a Bluetooth keyboard as often as with the
           on-screen one, and with the ring gone there was no way to tell whether the
           next thing typed was going into Email or into Password — a password typed into
           the email field is shown on screen, and the one visible clue that it happened
           was missing.

           :focus-visible and not :focus, so a tap on a touchscreen still draws nothing
           on a button: the browser only matches it where an indicator is wanted. A text
           field is always somewhere it is wanted, and matches on a tap too.

           The second rule is not a duplicate. `#login-box input` carries an id, which
           outranks a bare `:focus-visible` however far down the file it sits, so the
           general rule above lands on every control on the page EXCEPT the two this was
           written for. It has to be said again at least as specifically. */
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #login-box input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        /* The card is focused when its dialog opens, so that the next Tab is inside it.
           That is not a control anyone chose, and it must not be ringed. */
        .modal-content:focus { outline: none; }

        /* Reduce Motion, as the phone or the tablet asked for it. Duration rather than
           `animation: none`, so a zero-length transition still fires and still ends. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <div id="login-overlay" class="hidden">
        <!-- In a <template> on purpose: its contents are a detached fragment, so the
             password field is NOT in the document. iOS offers to fill a password field
             it finds in the DOM whether or not anything is showing it, and it did —
             on a till that was already signed in, mid-service. auth-gate.js clones this
             in the moment a sign-in is actually needed, and not before. -->
        <template id="login-box-template">
            <div id="login-box">
                <h2>ILA Inventory</h2>
                <input type="email" id="login-email" aria-label="Email" placeholder="Email" autocomplete="username">
                <input type="password" id="login-password" aria-label="Password" placeholder="Password" autocomplete="current-password">
                <button onclick="window.signInInventory()">Sign In</button>
                <div id="login-error"></div>
            </div>
        </template>
    </div>

    <div class="container">
        <header>
            <h1>Kitchen & Prep</h1>
            <p style="font-size: 0.75rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 2px;">Live Inventory Log</p>
        </header>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('bar')">Bar</button>
            <button class="tab-btn" onclick="switchTab('creamery')">Creamery</button>
            <button class="tab-btn" onclick="switchTab('kitchen')">Kitchen</button>
            <button class="tab-btn" onclick="switchTab('bakery')">Bakery</button>
            <button class="tab-btn" onclick="switchTab('packaging')">Packaging</button>
            <!-- Every prep and delivery has been recorded since this page was
                 written, and nothing has ever shown any of it. When a count does
                 not match the shelf, this is the thing you want to look at. -->
            <button class="tab-btn" onclick="switchTab('log')">Log</button>
        </div>

        <div id="dynamic-tabs-container">
            <p style="text-align: center; margin-top: 50px; font-size: 0.85rem; letter-spacing: 2px; text-transform: uppercase;">Loading database&hellip;</p>
        </div>

        <div id="tab-log" class="tab-content">
            <h2>Recent activity</h2>
            <div id="log-list">
                <p>Loading…</p>
            </div>
        </div>

    </div>

    <div id="action-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" class="modal-title">Log Action</h3>
            <div id="modal-subtitle" class="modal-subtitle">Details</div>
            
            <input type="number" id="modal-qty" class="remark-input" inputmode="decimal" placeholder="Amount (Units / Kg / L)" step="any">
            <input type="text" id="modal-pin" class="remark-input" placeholder="Staff PIN" pattern="[0-9]*" inputmode="numeric" maxlength="4" autocomplete="off" data-pin>
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="modal-confirm-btn" onclick="confirmAction()">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast">Log Saved!</div>

    <!-- Ours, in the order they ran in when they were in the head. Nothing here
         needs the SDK and the SDK needs nothing here; what needs both is the
         script at the end, which calls into whichever of these the page loads on
         its first pass. That is what keeps all of it synchronous and above it. -->
    <!-- Keeps a signed-in device signed in, and stops the login form being
         shown to somebody who is already signed in. See the top of the file. -->
    <script src="/auth-gate.js"></script>
    <!-- Masks the staff PIN without making it a field iOS offers to fill. -->
    <script src="/pin-mask.js"></script>
    <!-- The app's own way of saying something. alert() blocks the event loop, which
         on a till means it stops receiving orders while it is up. See dialogs.js. -->
    <script src="/dialogs.js"></script>
    <!-- Says so when this screen stops talking to the database. Every device here is
         on cafe wifi, and the failure is silent by construction: the last data stays
         on screen and new writes wait in memory. See connection.js. -->
    <script src="/connection.js"></script>

    <!-- The SDK. It lives here rather than in the head so that everything above it
         can be parsed and painted first; the preload tags up there start the
         download at the same moment the old head tags did. See the note beside
         them.

         Two things about this block must not change. It has to stay ABOVE the
         script below — that script calls firebase.initializeApp on its first
         working line — and these have to stay plain synchronous tags. Adding defer
         to them would be the one change that looks harmless and is not: deferred
         scripts run after the parser finishes, which is AFTER the inline script
         below has already run and already thrown on an undefined `firebase`. -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"
            integrity="sha384-rGbwvB6k85I5jkhcy5vYOSdABhBKcD9CHXb0RJIIuxMYVZatT6uul1faR/C5QI1U"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"
            integrity="sha384-DVRvWnCIBtUIWOm6GpD+wukXwI8nijglXsBFYMlBIOgL5qBHlB8sa1CUlOftmd0R"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"
            integrity="sha384-FlKYNHBedwGFdcKg5PNKA38dWBcbf9RzKO4qBmxO3DaDw5yuYP0DXikg/fgj4xID"
            crossorigin="anonymous"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAgUmy9NjbDnYXX_TBBjF8-qj36aW21qsQ",
            authDomain: "ila-cafe.firebaseapp.com",
            databaseURL: "https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ila-cafe",
            storageBucket: "ila-cafe.firebasestorage.app",
            messagingSenderId: "473595092965",
            appId: "1:473595092965:web:4ba6243e67b9ed0adb990c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const auth = firebase.auth();
        let inventoryStarted = false;
        // Ingredient names come from admin and land in both the visible text and a JS
        // string inside an onclick attribute. Neither was escaped, so "Baker's
        // chocolate" ended the string early and the button stopped working — the whole
        // point of this page being to press that button.
        //
        // escapeHTML for text; jsAttr for anything crossing into a handler argument,
        // which has to survive the HTML parser and then the JS parser.
        function escapeHTML(str) {
            return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function jsAttr(str) {
            return escapeHTML(String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
        }

        // These delegate to auth-gate.js so that six pages cannot disagree about what a
        // login screen is — but they must not DEPEND on it. A same-origin script can still
        // fail to arrive on a cold cache, and a page whose whole inline script dies on the
        // first line is a till that will not open. So the gate is an enhancement: present,
        // it remembers the role and keeps the password field out of the way; absent, these
        // do exactly what they always did.
        const roleCache = window.ilaRole || { recall: () => null, remember: () => {}, forget: () => {} };
        function showLogin(msg) {
            if (window.ilaLoginBox) return window.ilaLoginBox.ready(msg);
            // Gate missing: clone the form in ourselves rather than reveal an empty box.
            const tpl = document.getElementById('login-box-template');
            const host = document.getElementById('login-overlay');
            if (tpl && host && !document.getElementById('login-box')) host.appendChild(tpl.content.cloneNode(true));
            host.classList.remove('hidden');
            const err = document.getElementById('login-error');
            if (err && msg) err.innerText = msg;
        }
        function hideLogin() {
            if (window.ilaLoginBox) return window.ilaLoginBox.hide();
            document.getElementById('login-overlay').classList.add('hidden');
            const err = document.getElementById('login-error');   // absent until the form is cloned in
            if (err) err.innerText = "";
        }
        // Before auth has resolved nothing is known, so nothing is asked for.
        if (window.ilaLoginBox) window.ilaLoginBox.checking();
        window.signInInventory = function() {
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-password').value;
            document.getElementById('login-error').innerText = "Signing in...";
            auth.signInWithEmailAndPassword(email, pw).catch(() => { document.getElementById('login-error').innerText = "Sign-in failed. Check email and password."; });
        };
        auth.onAuthStateChanged(async (user) => {
            if (!user) { roleCache.forget(); showLogin(); return; }

            // What this device already knew about this uid. Enough to open on: the role
            // only decides which screen gets drawn, and database.rules.json decides every
            // read and write behind it. Waiting on the network to redraw the same screen
            // is the whole of the delay staff were reading as "it signed me out again".
            const known = roleCache.recall(user.uid);
            const admit = (p) => {
                hideLogin();
                if (!inventoryStarted) { inventoryStarted = true; startInventory(); }
            };
            if (known) admit(known);

            try {
                const prof = (await db.ref('users/' + user.uid).once('value')).val();
                if (!prof || !prof.role) {
                    roleCache.forget();
                    await auth.signOut();
                    showLogin("This account has no access.");
                    return;
                }
                roleCache.remember(user.uid, prof);
                admit(prof);
            } catch (e) {
                // A read that failed says nothing about the account, so it must not put
                // anybody out. A device already open on a remembered role stays open; one
                // with nothing remembered is the only one that has to wait for an answer.
                if (!known) showLogin("Could not verify access. Check connection and retry.");
            }
        });
        function startInventory() {
            db.ref('inventory/stock').on('value', snap => { currentStock = snap.val() || {}; renderUI(); });
            // No recipes and no staff map any more. The Worker reads the recipe when it
            // logs a batch — a client that computes its own deductions can under-report
            // what one consumed — and it checks the PIN against staff itself. This tablet
            // used to hold every PIN hash in the café, with the salt in its own source, to
            // answer a question it was never the right place to answer.
            db.ref('inventory/config/items').on('value', snap => { dynamicInventoryMap = snap.val() || {}; renderUI(); });
            // Bounded: this node only grows, and the tab is for "what happened
            // recently", not for the whole history of the café.
            db.ref('inventory/logs').limitToLast(80).on('value', snap => renderLog(snap));
        }

        let currentStock = {};
        let activeAction = { type: "", itemName: "" };
        let dynamicInventoryMap = {};

        // Real-time Listeners


        
        // Listen to the new dynamic config set by Admin

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Sorted here, on a number, rather than by leaning on the order the keys
        // come back in. Two kinds of key are mixed in this node — the millisecond
        // timestamps written before this change, and push IDs after it — and
        // getting newest-first from that depends on how Firebase collates
        // integer-like keys against string ones. It does the right thing, but a
        // log that quietly lists itself backwards is not worth the cleverness.
        //
        // `at` is the number the row carries; rows written before it existed have
        // only their key, which was the timestamp.
        function logAt(key, v) {
            return Number(v.at) || Number(key) || 0;
        }

        function renderLog(snap) {
            const el = document.getElementById('log-list');
            if (!el) return;
            const rows = [];
            snap.forEach(child => {
                const v = child.val() || {};
                rows.push({ v, at: logAt(child.key, v) });
            });
            rows.sort((a, b) => b.at - a.at);
            if (!rows.length) {
                el.innerHTML = '<p>Nothing logged yet.</p>';
                return;
            }
            let html = '';
            for (const row of rows) {
                const v = row.v;
                const amount = v.amount != null ? v.amount : v.yieldAmount;
                html += '<div class="log-row"><div>' +
                            '<div class="log-what">' + escapeHTML(v.action || 'Logged') + ' &middot; ' +
                                escapeHTML(v.item || '') +
                                (amount != null ? ' &times; ' + escapeHTML(amount) : '') + '</div>' +
                            '<div class="log-who">' + escapeHTML(v.staff || 'unknown') + '</div>' +
                            (v.deductions ? '<div class="log-detail">used ' + escapeHTML(v.deductions) + '</div>' : '') +
                        '</div>' +
                        '<div class="log-when">' + escapeHTML(logWhen(row.at, v)) + '</div>' +
                    '</div>';
            }
            el.innerHTML = html;
        }

        // `time` is whatever toLocaleString() produced on whichever device wrote it,
        // so it is unsortable and reads differently per phone. The number is what
        // gets used; the string is the fallback for a row that has neither.
        function logWhen(at, v) {
            if (!at) return v.time || '';
            const mins = Math.round((Date.now() - at) / 60000);
            if (mins < 2) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.round(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return new Date(at).toLocaleDateString();
        }

        function renderUI() {
            if(Object.keys(dynamicInventoryMap).length === 0) return;
            
            const container = document.getElementById('dynamic-tabs-container');
            let tabsHtml = "";
            let isFirst = true;
            
            // Define standard tab order for consistency
            const tabOrder = ['bar', 'creamery', 'kitchen', 'bakery', 'packaging'];

            tabOrder.forEach(tab => {
                if(!dynamicInventoryMap[tab]) return;
                
                let tabHtml = `<div id="tab-${tab}" class="tab-content ${isFirst ? 'active' : ''}">`;
                
                // Prepped Section (Yield Outputs) - Ordered exactly as set in Admin
                let preppedArr = dynamicInventoryMap[tab].prepped || [];
                if (preppedArr.length > 0) {
                    tabHtml += `<h2>Log New Prep</h2><div class="grid-layout">`;
                    preppedArr.forEach(item => {
                        let stockLevel = currentStock[item] ? parseFloat(currentStock[item]).toFixed(1) : "0";
                        tabHtml += `<button class="action-btn" onclick="openModal('prep', '${jsAttr(item)}')">
                                        + ${escapeHTML(item)}
                                        <span class="stock-badge">Stock: ${stockLevel}</span>
                                    </button>`;
                    });
                    tabHtml += `</div>`;
                }

                // Raw Section (Deliveries Inputs) - Ordered exactly as set in Admin
                let rawArr = dynamicInventoryMap[tab].raw || [];
                if (rawArr.length > 0) {
                    tabHtml += `<h2>Receive Delivery</h2><div class="grid-layout">`;
                    rawArr.forEach(item => {
                        let stockLevel = currentStock[item] ? parseFloat(currentStock[item]).toFixed(1) : "0";
                        tabHtml += `<button class="action-btn outline" onclick="openModal('receive', '${jsAttr(item)}')">
                                        + ${escapeHTML(item)}
                                        <span class="stock-badge">Stock: ${stockLevel}</span>
                                    </button>`;
                    });
                    tabHtml += `</div>`;
                }

                tabHtml += `</div>`;
                tabsHtml += tabHtml;
                isFirst = false;
            });
            container.innerHTML = tabsHtml;
            
            // Maintain active tab
            const activeBtn = document.querySelector('.tab-btn.active');
            if(activeBtn) {
                const tabId = activeBtn.innerText.toLowerCase();
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const tgt = document.getElementById(`tab-${tabId}`);
                if(tgt) tgt.classList.add('active');
            }
        }

        // Whatever was touched to open the dialog, so closing can put focus back on it.
        let modalOpener = null;

        function openModal(type, itemName) {
            activeAction = { type, itemName };
            document.getElementById('modal-qty').value = "";
            if (window.ilaPin) window.ilaPin.clear(document.getElementById('modal-pin')); else document.getElementById('modal-pin').value = "";
            
            if (type === 'prep') {
                document.getElementById('modal-title').innerText = `Log Prep: ${itemName}`;
                document.getElementById('modal-subtitle').innerText = "This will automatically deduct raw ingredients.";
            } else {
                document.getElementById('modal-title').innerText = `Receive: ${itemName}`;
                document.getElementById('modal-subtitle').innerText = "Add incoming supplier deliveries to stock.";
            }
            
            modalOpener = document.activeElement;
            document.getElementById('action-modal').classList.add('active');
            setTimeout(() => document.getElementById('modal-qty').focus(), 100);
        }

        function closeModal() {
            document.getElementById('action-modal').classList.remove('active');
            // Back to the Prep or Receive button that opened it, rather than the top of a
            // list that is as long as the stock room.
            const back = modalOpener; modalOpener = null;
            if (back && back.isConnected) back.focus();
        }

        // A WAY OUT THAT IS NOT THE CANCEL BUTTON
        // This dialog asks for a quantity and a PIN, so it is opened with a keyboard up
        // and it is where a mis-tap on the wrong shelf item lands. Escape and a tap on the
        // brown around the card both cancel it, which is what every other dialog in this
        // repo already did and this one did not. Tab is held inside it: the stock list
        // behind is a live column of Prep and Receive buttons, and a keyboard could reach
        // all of them straight through the overlay.
        (function bindDialog(){
            const ov = document.getElementById('action-modal');
            const card = ov.querySelector('.modal-content');
            if (card) card.setAttribute('tabindex', '-1');

            ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });

            const FOCUSABLE = 'a[href], button:not([disabled]), input:not([disabled]), ' +
                              'select:not([disabled]), textarea:not([disabled]), ' +
                              '[tabindex]:not([tabindex="-1"])';
            document.addEventListener('keydown', e => {
                if (!ov.classList.contains('active')) return;

                if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }

                if (e.key !== 'Tab') return;
                const stops = [...ov.querySelectorAll(FOCUSABLE)].filter(el => el.getClientRects().length > 0);
                if (!stops.length) return;
                const at = stops.indexOf(document.activeElement);
                if (e.shiftKey && at <= 0) { e.preventDefault(); stops[stops.length - 1].focus(); }
                else if (!e.shiftKey && (at === -1 || at === stops.length - 1)) { e.preventDefault(); stops[0].focus(); }
            });
        })();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            if(navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Stock moves through the Worker, not from here.
        //
        // The PIN prompt in front of this was advice twice over. It ran in a browser the
        // person filling it in controls, and the write did not need it at all: the rule on
        // inventory was "has a staff role", so anyone signed in could adjust stock directly
        // and leave no log line. Stock that moved with nothing explaining it is worse than
        // a log line with the wrong name on it.
        //
        // inventory/stock and inventory/logs are now written by the robot alone. The Worker
        // checks the PIN where a browser cannot skip it, reads the recipe itself rather than
        // being told it — a client that computes its own deductions can under-report what a
        // batch consumed — and writes the stock movement and its log line as one write.
        const INV_WORKER_URL = 'https://ila-push.sraveen-chirania.workers.dev/';
        async function invLogToWorker(kind, item, qty, pin){
            let token = null;
            try { const u = auth.currentUser; token = u ? await u.getIdToken() : null; } catch(e){}
            if (!token) return { ok:false, why:'You are signed out. Sign in and try again.' };
            let res;
            try {
                res = await fetch(INV_WORKER_URL, {
                    method:'POST', headers:{ 'Content-Type':'text/plain' },
                    body: JSON.stringify({ action:'inventory-log', token: token, pin: pin,
                                           kind: kind, item: item, qty: qty })
                });
            } catch(e){
                return { ok:false, why:'Could not reach the stock service. Nothing was logged \u2014 check the connection and try again.' };
            }
            let body = null; try { body = await res.json(); } catch(e){}
            if (res.ok && body && body.ok) return { ok:true, staff: body.staff };
            if (res.status === 403 && body && body.error === 'invalid pin') return { ok:false, why:'Invalid PIN.' };
            return { ok:false, why:'Could not log it: ' + ((body && body.error) || ('error ' + res.status)) + '\nNothing was changed.' };
        }

        async function confirmAction() {
            const qtyInput = parseFloat(document.getElementById('modal-qty').value);
            const _pinEl = document.getElementById('modal-pin');
            // bullets on screen, digits in pin-mask.js; the element is the fallback
            const pinStr = (window.ilaPin ? window.ilaPin.value(_pinEl) : (_pinEl.value || '')).trim();
            const btn = document.getElementById('modal-confirm-btn');

            if (isNaN(qtyInput) || qtyInput <= 0) return ilaFieldError('modal-qty', "Enter a valid amount");

            btn.innerText = "Processing...";
            btn.disabled = true;
            try {
                const r = await invLogToWorker(activeAction.type, activeAction.itemName, qtyInput, pinStr);
                if (!r.ok) { ilaTell("Cannot record that", r.why); return; }
                closeModal();
                showToast(`Successfully logged ${qtyInput} ${activeAction.itemName}`);
            } finally {
                btn.innerText = "Confirm";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
