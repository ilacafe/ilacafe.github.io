<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ILA | Inventory</title>
    <link rel="apple-touch-icon" href="/icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"
            integrity="sha384-rGbwvB6k85I5jkhcy5vYOSdABhBKcD9CHXb0RJIIuxMYVZatT6uul1faR/C5QI1U"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"
            integrity="sha384-DVRvWnCIBtUIWOm6GpD+wukXwI8nijglXsBFYMlBIOgL5qBHlB8sa1CUlOftmd0R"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"
            integrity="sha384-FlKYNHBedwGFdcKg5PNKA38dWBcbf9RzKO4qBmxO3DaDw5yuYP0DXikg/fgj4xID"
            crossorigin="anonymous"></script>

    <!-- Keeps a signed-in device signed in, and stops the login form being
         shown to somebody who is already signed in. See the top of the file. -->
    <script src="/auth-gate.js"></script>

    <style>
        :root { --brand-bg: #8D6E52; --brand-text: #ffffff; }
        #login-overlay { position: fixed; inset: 0; background: var(--brand-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #login-overlay.hidden { display: none; }
        #login-box { width: 100%; max-width: 320px; text-align: center; }
        #login-box h2 { letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 25px; }
        #login-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff; font-family: 'Quicksand', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; }
        #login-box button { width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px; background: #fff; color: var(--brand-bg); font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        #login-error { color: #ffcfcf; font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }
        body { background-color: var(--brand-bg); color: var(--brand-text); font-family: 'Quicksand', sans-serif; margin: 0; padding: 0; line-height: 1.6; display: flex; flex-direction: column; align-items: center; padding-bottom: 60px; }
        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 15px; box-sizing: border-box; }
        
        header { text-align: center; margin-bottom: 20px; margin-top: 10px; }
        .logo { max-width: 250px; height: auto; display: block; margin: 0 auto; }
        h1 { font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 3px; margin: 10px 0 0 0; }
        
        /* TABS NAV */
        .tab-bar { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 25px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab-bar::-webkit-scrollbar { display: none; }
        .tab-btn { background: transparent; color: white; border: none; font-family: 'Quicksand', sans-serif; font-size: 0.95rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; padding: 10px 15px; cursor: pointer; opacity: 0.4; transition: opacity 0.2s, border-bottom 0.2s; white-space: nowrap; }
        .tab-btn.active { opacity: 1; border-bottom: 3px solid white; }

        .tab-content { display: none; animation: fadeIn 0.3s ease-in-out; }
        .tab-content.active { display: block; }
        .log-row { border-bottom: 1px solid rgba(255,255,255,0.12); padding: 12px 2px; display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
        .log-what { font-weight: 700; }
        .log-who { opacity: 0.75; font-size: 0.85rem; }
        .log-when { opacity: 0.55; font-size: 0.8rem; white-space: nowrap; }
        .log-detail { opacity: 0.6; font-size: 0.8rem; margin-top: 3px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        h2 { font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-top: 0; margin-bottom: 15px; opacity: 0.9; }

        /* GRID BUTTONS */
        .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 35px; }
        .action-btn { background-color: var(--brand-text); color: var(--brand-bg); border: none; padding: 15px 10px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; font-family: 'Quicksand', sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: transform 0.1s; min-height: 80px;}
        .action-btn:active { transform: scale(0.97); }
        .action-btn.outline { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255,255,255,0.4); box-shadow: none; }
        
        .stock-badge { font-size: 0.75rem; font-weight: normal; opacity: 0.8; margin-top: 5px; background: rgba(0,0,0,0.1); padding: 2px 8px; border-radius: 12px; }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); display: flex; justify-content: center; align-items: flex-start; padding-top: 10vh; box-sizing: border-box; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background-color: var(--brand-bg); border: 1px solid rgba(255,255,255,0.2); padding: 25px 20px; border-radius: 12px; text-align: center; width: 85%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); }
        
        .modal-title { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 0; margin-bottom: 5px; }
        .modal-subtitle { font-size: 0.85rem; opacity: 0.7; margin-bottom: 20px; font-style: italic; }

        .remark-input { width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); font-family: 'Quicksand', sans-serif; font-size: 1.1rem; background-color: rgba(0,0,0,0.1); color: white; display: block; box-sizing: border-box; outline: none; text-align: center; font-weight: bold;}
        .remark-input::placeholder { color: rgba(255,255,255,0.4); font-weight: normal; }
        /* A four-digit staff PIN is not a password, and type="password" was only ever
           masking it. That is what put an iOS "sign in with your password" sheet over
           a working till: Safari looks for a password field in the DOCUMENT, finds this
           one from the moment the page loads, and offers to fill it — whether or not
           anything is showing. Masking is a presentation job, so it is done here, and
           the field goes back to being the numeric input it always was. */
        .pin-input { -webkit-text-security: disc; text-security: disc; }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn { flex: 1; padding: 15px; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; font-family: 'Quicksand', sans-serif; text-transform: uppercase; border: none; letter-spacing: 1px;}
        .btn-primary { background-color: var(--brand-text); color: var(--brand-bg); }
        .btn-secondary { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255,255,255,0.4); }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: white; color: var(--brand-bg); padding: 12px 25px; border-radius: 30px; font-weight: bold; font-size: 0.9rem; transition: transform 0.3s ease; z-index: 3000; box-shadow: 0 5px 15px rgba(0,0,0,0.3); white-space: nowrap; pointer-events: none;}
        #toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>
    <div id="login-overlay" class="hidden">
        <!-- In a <template> on purpose: its contents are a detached fragment, so the
             password field is NOT in the document. iOS offers to fill a password field
             it finds in the DOM whether or not anything is showing it, and it did —
             on a till that was already signed in, mid-service. auth-gate.js clones this
             in the moment a sign-in is actually needed, and not before. -->
        <template id="login-box-template">
            <div id="login-box">
                <h2>ILA Inventory</h2>
                <input type="email" id="login-email" placeholder="Email" autocomplete="username">
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
                <button onclick="window.signInInventory()">Sign In</button>
                <div id="login-error"></div>
            </div>
        </template>
    </div>

    <div class="container">
        <header>
            <h1>Kitchen & Prep</h1>
            <p style="opacity: 0.7; font-size: 0.8rem; margin-top: 5px; text-transform: uppercase; letter-spacing: 1px;">Live Inventory Log</p>
        </header>

        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('bar')">Bar</button>
            <button class="tab-btn" onclick="switchTab('creamery')">Creamery</button>
            <button class="tab-btn" onclick="switchTab('kitchen')">Kitchen</button>
            <button class="tab-btn" onclick="switchTab('bakery')">Bakery</button>
            <button class="tab-btn" onclick="switchTab('packaging')">Packaging</button>
            <!-- Every prep and delivery has been recorded since this page was
                 written, and nothing has ever shown any of it. When a count does
                 not match the shelf, this is the thing you want to look at. -->
            <button class="tab-btn" onclick="switchTab('log')">Log</button>
        </div>

        <div id="dynamic-tabs-container">
            <p style="text-align: center; opacity: 0.5; margin-top: 50px;">Loading Database...</p>
        </div>

        <div id="tab-log" class="tab-content">
            <h2>Recent activity</h2>
            <div id="log-list">
                <p style="opacity:0.5;">Loading…</p>
            </div>
        </div>

    </div>

    <div id="action-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" class="modal-title">Log Action</h3>
            <div id="modal-subtitle" class="modal-subtitle">Details</div>
            
            <input type="number" id="modal-qty" class="remark-input" placeholder="Amount (Units / Kg / L)" step="any">
            <input type="text" id="modal-pin" class="remark-input pin-input" placeholder="Staff PIN" pattern="[0-9]*" inputmode="numeric" maxlength="4" autocomplete="off">
            
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" id="modal-confirm-btn" onclick="confirmAction()">Confirm</button>
            </div>
        </div>
    </div>

    <div id="toast">Log Saved!</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAgUmy9NjbDnYXX_TBBjF8-qj36aW21qsQ",
            authDomain: "ila-cafe.firebaseapp.com",
            databaseURL: "https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ila-cafe",
            storageBucket: "ila-cafe.firebasestorage.app",
            messagingSenderId: "473595092965",
            appId: "1:473595092965:web:4ba6243e67b9ed0adb990c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const auth = firebase.auth();
        let inventoryStarted = false;
        // Ingredient names come from admin and land in both the visible text and a JS
        // string inside an onclick attribute. Neither was escaped, so "Baker's
        // chocolate" ended the string early and the button stopped working — the whole
        // point of this page being to press that button.
        //
        // escapeHTML for text; jsAttr for anything crossing into a handler argument,
        // which has to survive the HTML parser and then the JS parser.
        function escapeHTML(str) {
            return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        function jsAttr(str) {
            return escapeHTML(String(str == null ? "" : str).replace(/\\/g, "\\\\").replace(/'/g, "\\'"));
        }

        // These delegate to auth-gate.js so that six pages cannot disagree about what a
        // login screen is — but they must not DEPEND on it. A same-origin script can still
        // fail to arrive on a cold cache, and a page whose whole inline script dies on the
        // first line is a till that will not open. So the gate is an enhancement: present,
        // it remembers the role and keeps the password field out of the way; absent, these
        // do exactly what they always did.
        const roleCache = window.ilaRole || { recall: () => null, remember: () => {}, forget: () => {} };
        function showLogin(msg) {
            if (window.ilaLoginBox) return window.ilaLoginBox.ready(msg);
            // Gate missing: clone the form in ourselves rather than reveal an empty box.
            const tpl = document.getElementById('login-box-template');
            const host = document.getElementById('login-overlay');
            if (tpl && host && !document.getElementById('login-box')) host.appendChild(tpl.content.cloneNode(true));
            host.classList.remove('hidden');
            const err = document.getElementById('login-error');
            if (err && msg) err.innerText = msg;
        }
        function hideLogin() {
            if (window.ilaLoginBox) return window.ilaLoginBox.hide();
            document.getElementById('login-overlay').classList.add('hidden');
            const err = document.getElementById('login-error');   // absent until the form is cloned in
            if (err) err.innerText = "";
        }
        // Before auth has resolved nothing is known, so nothing is asked for.
        if (window.ilaLoginBox) window.ilaLoginBox.checking();
        window.signInInventory = function() {
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-password').value;
            document.getElementById('login-error').innerText = "Signing in...";
            auth.signInWithEmailAndPassword(email, pw).catch(() => { document.getElementById('login-error').innerText = "Sign-in failed. Check email and password."; });
        };
        auth.onAuthStateChanged(async (user) => {
            if (!user) { roleCache.forget(); showLogin(); return; }

            // What this device already knew about this uid. Enough to open on: the role
            // only decides which screen gets drawn, and database.rules.json decides every
            // read and write behind it. Waiting on the network to redraw the same screen
            // is the whole of the delay staff were reading as "it signed me out again".
            const known = roleCache.recall(user.uid);
            const admit = (p) => {
                hideLogin();
                if (!inventoryStarted) { inventoryStarted = true; startInventory(); }
            };
            if (known) admit(known);

            try {
                const prof = (await db.ref('users/' + user.uid).once('value')).val();
                if (!prof || !prof.role) {
                    roleCache.forget();
                    await auth.signOut();
                    showLogin("This account has no access.");
                    return;
                }
                roleCache.remember(user.uid, prof);
                admit(prof);
            } catch (e) {
                // A read that failed says nothing about the account, so it must not put
                // anybody out. A device already open on a remembered role stays open; one
                // with nothing remembered is the only one that has to wait for an answer.
                if (!known) showLogin("Could not verify access. Check connection and retry.");
            }
        });
        function startInventory() {
            db.ref('inventory/stock').on('value', snap => { currentStock = snap.val() || {}; renderUI(); });
            // No recipes and no staff map any more. The Worker reads the recipe when it
            // logs a batch — a client that computes its own deductions can under-report
            // what one consumed — and it checks the PIN against staff itself. This tablet
            // used to hold every PIN hash in the café, with the salt in its own source, to
            // answer a question it was never the right place to answer.
            db.ref('inventory/config/items').on('value', snap => { dynamicInventoryMap = snap.val() || {}; renderUI(); });
            // Bounded: this node only grows, and the tab is for "what happened
            // recently", not for the whole history of the café.
            db.ref('inventory/logs').limitToLast(80).on('value', snap => renderLog(snap));
        }

        let currentStock = {};
        let activeAction = { type: "", itemName: "" };
        let dynamicInventoryMap = {};

        // Real-time Listeners



        
        // Listen to the new dynamic config set by Admin


        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Sorted here, on a number, rather than by leaning on the order the keys
        // come back in. Two kinds of key are mixed in this node — the millisecond
        // timestamps written before this change, and push IDs after it — and
        // getting newest-first from that depends on how Firebase collates
        // integer-like keys against string ones. It does the right thing, but a
        // log that quietly lists itself backwards is not worth the cleverness.
        //
        // `at` is the number the row carries; rows written before it existed have
        // only their key, which was the timestamp.
        function logAt(key, v) {
            return Number(v.at) || Number(key) || 0;
        }

        function renderLog(snap) {
            const el = document.getElementById('log-list');
            if (!el) return;
            const rows = [];
            snap.forEach(child => {
                const v = child.val() || {};
                rows.push({ v, at: logAt(child.key, v) });
            });
            rows.sort((a, b) => b.at - a.at);
            if (!rows.length) {
                el.innerHTML = '<p style="opacity:0.5;">Nothing logged yet.</p>';
                return;
            }
            let html = '';
            for (const row of rows) {
                const v = row.v;
                const amount = v.amount != null ? v.amount : v.yieldAmount;
                html += '<div class="log-row"><div>' +
                            '<div class="log-what">' + escapeHTML(v.action || 'Logged') + ' &middot; ' +
                                escapeHTML(v.item || '') +
                                (amount != null ? ' &times; ' + escapeHTML(amount) : '') + '</div>' +
                            '<div class="log-who">' + escapeHTML(v.staff || 'unknown') + '</div>' +
                            (v.deductions ? '<div class="log-detail">used ' + escapeHTML(v.deductions) + '</div>' : '') +
                        '</div>' +
                        '<div class="log-when">' + escapeHTML(logWhen(row.at, v)) + '</div>' +
                    '</div>';
            }
            el.innerHTML = html;
        }

        // `time` is whatever toLocaleString() produced on whichever device wrote it,
        // so it is unsortable and reads differently per phone. The number is what
        // gets used; the string is the fallback for a row that has neither.
        function logWhen(at, v) {
            if (!at) return v.time || '';
            const mins = Math.round((Date.now() - at) / 60000);
            if (mins < 2) return 'just now';
            if (mins < 60) return mins + 'm ago';
            const hrs = Math.round(mins / 60);
            if (hrs < 24) return hrs + 'h ago';
            return new Date(at).toLocaleDateString();
        }

        function renderUI() {
            if(Object.keys(dynamicInventoryMap).length === 0) return;
            
            const container = document.getElementById('dynamic-tabs-container');
            container.innerHTML = "";
            let isFirst = true;
            
            // Define standard tab order for consistency
            const tabOrder = ['bar', 'creamery', 'kitchen', 'bakery', 'packaging'];

            tabOrder.forEach(tab => {
                if(!dynamicInventoryMap[tab]) return;
                
                let tabHtml = `<div id="tab-${tab}" class="tab-content ${isFirst ? 'active' : ''}">`;
                
                // Prepped Section (Yield Outputs) - Ordered exactly as set in Admin
                let preppedArr = dynamicInventoryMap[tab].prepped || [];
                if (preppedArr.length > 0) {
                    tabHtml += `<h2>Log New Prep</h2><div class="grid-layout">`;
                    preppedArr.forEach(item => {
                        let stockLevel = currentStock[item] ? parseFloat(currentStock[item]).toFixed(1) : "0";
                        tabHtml += `<button class="action-btn" onclick="openModal('prep', '${jsAttr(item)}')">
                                        + ${escapeHTML(item)}
                                        <span class="stock-badge">Stock: ${stockLevel}</span>
                                    </button>`;
                    });
                    tabHtml += `</div>`;
                }

                // Raw Section (Deliveries Inputs) - Ordered exactly as set in Admin
                let rawArr = dynamicInventoryMap[tab].raw || [];
                if (rawArr.length > 0) {
                    tabHtml += `<h2>Receive Delivery</h2><div class="grid-layout">`;
                    rawArr.forEach(item => {
                        let stockLevel = currentStock[item] ? parseFloat(currentStock[item]).toFixed(1) : "0";
                        tabHtml += `<button class="action-btn outline" onclick="openModal('receive', '${jsAttr(item)}')">
                                        + ${escapeHTML(item)}
                                        <span class="stock-badge">Stock: ${stockLevel}</span>
                                    </button>`;
                    });
                    tabHtml += `</div>`;
                }

                tabHtml += `</div>`;
                container.innerHTML += tabHtml;
                isFirst = false;
            });
            
            // Maintain active tab
            const activeBtn = document.querySelector('.tab-btn.active');
            if(activeBtn) {
                const tabId = activeBtn.innerText.toLowerCase();
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                const tgt = document.getElementById(`tab-${tabId}`);
                if(tgt) tgt.classList.add('active');
            }
        }

        function openModal(type, itemName) {
            activeAction = { type, itemName };
            document.getElementById('modal-qty').value = "";
            document.getElementById('modal-pin').value = "";
            
            if (type === 'prep') {
                document.getElementById('modal-title').innerText = `Log Prep: ${itemName}`;
                document.getElementById('modal-subtitle').innerText = "This will automatically deduct raw ingredients.";
            } else {
                document.getElementById('modal-title').innerText = `Receive: ${itemName}`;
                document.getElementById('modal-subtitle').innerText = "Add incoming supplier deliveries to stock.";
            }
            
            document.getElementById('action-modal').classList.add('active');
            setTimeout(() => document.getElementById('modal-qty').focus(), 100);
        }

        function closeModal() {
            document.getElementById('action-modal').classList.remove('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            if(navigator.vibrate) navigator.vibrate(50);
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Stock moves through the Worker, not from here.
        //
        // The PIN prompt in front of this was advice twice over. It ran in a browser the
        // person filling it in controls, and the write did not need it at all: the rule on
        // inventory was "has a staff role", so anyone signed in could adjust stock directly
        // and leave no log line. Stock that moved with nothing explaining it is worse than
        // a log line with the wrong name on it.
        //
        // inventory/stock and inventory/logs are now written by the robot alone. The Worker
        // checks the PIN where a browser cannot skip it, reads the recipe itself rather than
        // being told it — a client that computes its own deductions can under-report what a
        // batch consumed — and writes the stock movement and its log line as one write.
        const INV_WORKER_URL = 'https://ila-push.sraveen-chirania.workers.dev/';
        async function invLogToWorker(kind, item, qty, pin){
            let token = null;
            try { const u = auth.currentUser; token = u ? await u.getIdToken() : null; } catch(e){}
            if (!token) return { ok:false, why:'You are signed out. Sign in and try again.' };
            let res;
            try {
                res = await fetch(INV_WORKER_URL, {
                    method:'POST', headers:{ 'Content-Type':'text/plain' },
                    body: JSON.stringify({ action:'inventory-log', token: token, pin: pin,
                                           kind: kind, item: item, qty: qty })
                });
            } catch(e){
                return { ok:false, why:'Could not reach the stock service. Nothing was logged \u2014 check the connection and try again.' };
            }
            let body = null; try { body = await res.json(); } catch(e){}
            if (res.ok && body && body.ok) return { ok:true, staff: body.staff };
            if (res.status === 403 && body && body.error === 'invalid pin') return { ok:false, why:'Invalid PIN.' };
            return { ok:false, why:'Could not log it: ' + ((body && body.error) || ('error ' + res.status)) + '\nNothing was changed.' };
        }

        async function confirmAction() {
            const qtyInput = parseFloat(document.getElementById('modal-qty').value);
            const pinStr = document.getElementById('modal-pin').value.trim();
            const btn = document.getElementById('modal-confirm-btn');

            if (isNaN(qtyInput) || qtyInput <= 0) return alert("Please enter a valid amount.");

            btn.innerText = "Processing...";
            btn.disabled = true;
            try {
                const r = await invLogToWorker(activeAction.type, activeAction.itemName, qtyInput, pinStr);
                if (!r.ok) { alert(r.why); return; }
                closeModal();
                showToast(`Successfully logged ${qtyInput} ${activeAction.itemName}`);
            } finally {
                btn.innerText = "Confirm";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
