<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8D6E52">
    <title>ILA | Barista Display</title>
    <link rel="apple-touch-icon" href="/icon-barista.png" />
    <!-- THE TWO HOSTS THE BROWSER FINDS OUT ABOUT LAST
         A connection to a new host costs a DNS lookup, a TCP handshake and a TLS
         handshake before a single byte of what was asked for comes back — on café
         wifi, a good fraction of a second. The browser starts that work the moment
         it SEES a host, and it cannot see either of these until late:

           fonts.gstatic.com appears nowhere in this file. It is named inside the
           Google Fonts stylesheet below, so the browser only learns it exists once
           that stylesheet has been fetched and parsed, and only then starts a
           connection for the font files themselves.

           the database is worse. Its host is in firebaseConfig, at the foot of the
           page, and nothing connects to it until the SDK below has downloaded,
           parsed and run. That handshake happens after all of it, in series, while
           the page sits there with nothing on it.

         A preconnect names them here, at the top, so both handshakes happen early
         and alongside everything else rather than after it. crossorigin is required
         on the font one: fonts are fetched anonymously, and a preconnect whose mode
         does not match the request is a connection the browser throws away.

         Nothing else here needs one: every other host is named directly by a tag
         below, which is already the earliest the browser could possibly know. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app">
    <!-- LOADED WITHOUT BLOCKING THE FIRST PAINT
         With the SDK moved out of the head, this one-kilobyte stylesheet was the
         only thing left up here that could stop the page being drawn — and it
         stopped it for a whole round trip to another origin. Measured on a cold
         open with the font server answering in 800ms, first paint was ~890ms: the
         page was ready and waiting on this the entire time.

         media="print" means it does not apply to the screen, so the browser will
         not hold the paint for it; the onload swaps it to all as soon as it lands.
         Nothing is lost by that, because the URL already asks for display=swap —
         text was ALWAYS going to be drawn in the fallback face first and re-drawn
         in Quicksand when the font arrived. This only stops the rest of the page
         waiting for that to be arranged.

         The <noscript> copy keeps the ordinary behaviour where onload can never
         fire. These pages need JavaScript for anything at all, so it changes
         nothing in practice, but a stylesheet that silently depends on script is
         not a thing to leave unsaid. -->
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet"></noscript>

    <!-- PRELOADED HERE, RUN AT THE FOOT OF THE PAGE
         These three bundles are the better part of 400KB of JavaScript to compile,
         and they used to sit right here as ordinary script tags. A script tag in
         the head stops the parser dead: nothing below it is looked at, let alone
         painted, until the file has both arrived AND been compiled. So on a cold
         open the till, the kitchen screen and the customer's phone each showed a
         blank page for the whole of that — with the markup for the page they were
         waiting on sitting ready, unparsed, a few lines further down.

         The tags now sit at the foot of the body, directly above this page's own
         script, which is the last thing in the document. Same three files, same
         order, still ordinary synchronous tags — so `firebase` is defined before a
         line of page code runs, exactly as it was. What changed is only that the
         browser is allowed to parse and paint the page first.

         The preloads are the other half of it, and leaving them out would make
         this SLOWER rather than faster: a tag at the foot of the body is not
         DISCOVERED until the parser gets there, so the download would start late
         and the page would become usable later than it does today. rel=preload
         names the files up here, where the tags used to be, so the fetch begins at
         the same moment it always did, running alongside the parse rather than
         in place of it.

         crossorigin and integrity are repeated from the tags deliberately. A
         preload is only reused for a later request when the mode and the integrity
         metadata match it; if they do not, the browser fetches the same file
         twice, which is worse than never having preloaded it. -->
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"
          integrity="sha384-rGbwvB6k85I5jkhcy5vYOSdABhBKcD9CHXb0RJIIuxMYVZatT6uul1faR/C5QI1U">
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"
          integrity="sha384-DVRvWnCIBtUIWOm6GpD+wukXwI8nijglXsBFYMlBIOgL5qBHlB8sa1CUlOftmd0R">
    <link rel="preload" as="script" crossorigin="anonymous"
          href="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"
          integrity="sha384-FlKYNHBedwGFdcKg5PNKA38dWBcbf9RzKO4qBmxO3DaDw5yuYP0DXikg/fgj4xID">

    <!-- Ours, named here and run at the foot alongside the SDK.
         These are a few kilobytes each, which is not the point: the head is where
         a browser decides whether it may draw the page yet, and a synchronous
         script sitting in it means the answer is no, however small the file. They
         are named up here so the fetch still starts at the same moment, then run
         where they no longer hold anything up.

         Deferring them instead would be simpler and does not work. The page's own
         script calls into each of these on its first pass, and a deferred script
         does not run until after the parser has finished — which is after that
         call has already been made and already failed.

         No crossorigin on these, unlike the SDK preloads above: they are
         same-origin and fetched in that mode by default, so declaring it would
         stop the preload matching the tag and fetch each file twice. -->
    <link rel="preload" as="script" href="/auth-gate.js">
    <link rel="preload" as="script" href="/build-check.js">
    <link rel="preload" as="script" href="/connection.js">

    <style>
        :root { --brand-bg: #8D6E52; --brand-text: #ffffff;
            /* WHAT THE BROWSER PAINTS FOR US, AND WHICH WAY IT LEANS.
               Reported from the floor: the same build paints the Android home bar
               white on one phone and black on two others. That split is not random —
               it is a surface following the DEVICE's light/dark setting, because
               these pages never said which they were. Undeclared, `color-scheme` is
               `normal`, and every surface the browser draws on our behalf — the
               system bars of an installed app, native controls, scrollbars — is
               free to pick a side per device.
               This app is white on a mid-brown: a dark scheme, on every phone that
               opens it. Saying so makes those surfaces agree with each other, and
               stops Chrome's auto-dark-theme (which only touches pages that have
               not declared one) from inverting the brand on the phones set to dark.
               Every input here sets its own background, so nothing inherits a
               surprise from the change. */
            color-scheme: dark; }
        /* The brand, on the root as well as the body. Android paints the strip behind
           the home bar and the overscroll gutter from the canvas, and the canvas only
           inherits the body's background while html has none of its own — so on Android
           that area came out white while an iPhone looked seamless. Said in both places
           it cannot be anything else. */
        html { background-color: var(--brand-bg); }
        /* The platform tints these its own blue. accent-color is the whole fix — it
           keeps the native control, its behaviour and its semantics exactly as they
           are, and only says what colour. A hand-built checkbox would have bought the
           same look and a pile of keyboard and screen-reader work to get back to where
           the real one already was. */
        input[type="checkbox"], input[type="radio"], input[type="range"], progress {
            accent-color: var(--brand-text);
        }
        body { background-color: var(--brand-bg); color: var(--brand-text); font-family: 'Quicksand', sans-serif; margin: 0; padding: 0; line-height: 1.6; }
        /* THESE PAGES OPT INTO DRAWING UNDER THE NOTCH
           viewport-fit=cover in the head says "use the whole screen, including the
           parts hardware sits over". That is worth having on a wall-mounted board —
           and it is only half a decision. The other half is padding the content back
           out of those corners, which nothing here did: on a notched tablet in
           landscape, which is how a kitchen screen is mounted, the left edge of the
           board can sit under the camera housing.

           env() resolves to 0 wherever there is no notch, so this costs nothing on
           the displays that do not have one. */
        header { text-align: center; border-bottom: 1px solid rgba(255,255,255,0.2); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;
                 padding: calc(20px + env(safe-area-inset-top)) calc(5% + env(safe-area-inset-right)) 20px calc(5% + env(safe-area-inset-left)); }
        .logo { max-width: min(150px, 40vw); height: auto; display: block; }
        .header-title { font-size: 1.2rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; margin: 0;}
        .clock { font-size: 1.2rem; font-weight: bold; }
        .kds-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start;
                         padding: 0 calc(5% + env(safe-area-inset-right)) calc(50px + env(safe-area-inset-bottom)) calc(5% + env(safe-area-inset-left)); }
        .ticket-card { background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .ticket-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed rgba(255,255,255,0.3); padding-bottom: 15px; margin-bottom: 15px; }
        .ticket-dest { font-size: 1.6rem; font-weight: 700; text-transform: uppercase; line-height: 1; }
        .ticket-meta { text-align: right; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;}
        .ticket-time { font-size: 1.1rem; font-weight: bold; display: block; margin-bottom: 2px; color: #fff;}
        .ticket-items { flex-grow: 1; margin-bottom: 20px; }
        .item-row { display: flex; font-size: 1.3rem; margin-bottom: 10px; font-weight: 500; line-height: 1.3; align-items: flex-start;}
        .item-qty { font-weight: 700; width: 35px; flex-shrink: 0; }
        .item-name { flex-grow: 1; }
        .ticket-notes { background: rgba(255, 204, 0, 0.1); border-left: 3px solid #ffcc00; padding: 10px; margin-bottom: 20px; font-size: 0.95rem; color: #ffcc00; font-style: italic; border-radius: 0 4px 4px 0;}
        .btn-done { background-color: var(--brand-text); color: var(--brand-bg); border: none; padding: 15px; border-radius: 8px; font-weight: 700; font-size: 1.2rem; cursor: pointer; font-family: 'Quicksand', sans-serif; width: 100%; text-transform: uppercase; letter-spacing: 2px; transition: opacity 0.2s;}
        .btn-done:active { opacity: 0.7; }
        /* A QUIET BOARD, NOT A FAINT ONE
           This is the whole screen when the kitchen is caught up, and at 0.5 it was
           2.39:1 — below AA for large text, let alone the line under it. It should
           read calm, and calm is weight and letter-spacing: the heading drops from
           bold to regular and opens up to 6px, which reads quieter at full white
           than 32px bold at half opacity ever did, and is legible across a room. */
        .empty-state { text-align: center; grid-column: 1 / -1; margin-top: 50px; }
        .empty-state h2 { font-size: 2rem; text-transform: uppercase; letter-spacing: 6px; margin-bottom: 8px; font-weight: 400; }
        .empty-state p { letter-spacing: 1px; font-size: 0.95rem; margin: 0; }
        #login-overlay { position: fixed; inset: 0; background: var(--brand-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #login-overlay.hidden { display: none; }
        #login-box { width: 100%; max-width: 320px; text-align: center; }
        #login-box h2 { letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 25px; }
        #login-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff; font-family: 'Quicksand', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; }
        #login-box button { width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px; background: #fff; color: var(--brand-bg); font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        /* THE ONE LINE ON THIS SCREEN THAT HAS TO BE READ
           #ffcfcf on the brand brown is 3.36:1 — under AA, at full opacity, on the
           message that tells someone why they cannot get in.

           No pink fixes that. White is 4.68:1 on this background and everything
           tinted towards red is below it, so the lightest pink that would pass is
           white — which leaves two ways out: put the message on a different surface,
           or stop asking the colour of the text to carry the meaning.

           A panel was tried and is worse. Any box under a sign-in form reads as
           another field of the form, and a tinted one reads as a broken field.

           So the text is white and the red is a rule beside it. The message is legible
           because white passes; it is an error because the mark next to it is red and
           nothing else on this screen has one. Nothing is boxed, nothing is tinted,
           and when there is no error there is nothing there at all. */
        #login-error { color: #fff; font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; text-align: left; }
        #login-error:not(:empty) {
            border-left: 3px solid #ff8f8f; padding: 2px 0 2px 10px; line-height: 1.45;
        }
        .ticket-elapsed { font-weight: bold; }
        .ticket-card.overdue { border-color: #ff4d4d; background: rgba(255, 77, 77, 0.15); animation: kdsPulse 1.2s infinite; }
        .ticket-card.overdue .ticket-elapsed { color: #ff6b6b; }
        @keyframes kdsPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,77,0.5); } 50% { box-shadow: 0 0 0 7px rgba(255,77,77,0); } }
        /* Faint, bottom-right, out of the way. A kitchen screen is never reloaded,
           so "which build is this one on?" is otherwise unanswerable from the floor. */
        /* A DIAGNOSTIC IS STILL SOMETHING SOMEONE READS
           This exists so "which build is this screen on?" is answerable from the
           floor, and at 0.35 the answer was 1.88:1 — present, and unreadable, which
           is the worst of both.

           It gets out of the way by being small, cornered and widely tracked, not by
           being faint and not by wearing a pill. White on the brown is 4.68:1 unaided;
           a chip behind eleven characters in a corner is a dark tab stuck to the
           screen, louder than the text it was carrying. */
        /* THE BUILD STAMP IS NOT CONTENT
           It exists so "which build is this screen on?" is answerable from the floor
           — a question somebody asks maybe twice a year, and nobody reads in the
           course of using the page. Faint and cornered was the right instinct. The
           thing that was wrong is that at 0.22 the answer was 1.5:1, so looking it up
           still told you nothing: present, and unreadable, the worst of both.

           So it is quiet by default and legible on demand. Touch it, hover it or tab
           to it and it comes up to full white; the rest of the time it is a ghost in
           the corner, which is what a version string owes a customer looking at a
           menu. That is the condition on which the contrast suite exempts it, and the
           suite checks the condition rather than taking it on trust. */
        .build-stamp { font-size: 0.6rem; letter-spacing: 1.5px; color: #fff; opacity: 0.22;
                       transition: opacity 0.15s ease; }
        .build-stamp:hover, .build-stamp:focus, .build-stamp:active { opacity: 1; }
        .build-stamp { position: fixed; right: calc(10px + env(safe-area-inset-right)); bottom: calc(8px + env(safe-area-inset-bottom)); }

        /* SOMETHING TO SEE WHEN YOU TAB
           The sign-in box sets outline:none on both of its fields, and nothing replaced
           it. Staff sign these tablets in with a Bluetooth keyboard as often as with the
           on-screen one, and with the ring gone there was no way to tell whether the
           next thing typed was going into Email or into Password — a password typed into
           the email field is shown on screen, and the one visible clue that it happened
           was missing.

           :focus-visible and not :focus, so a tap on a touchscreen still draws nothing
           on a button: the browser only matches it where an indicator is wanted. A text
           field is always somewhere it is wanted, and matches on a tap too.

           The second rule is not a duplicate. `#login-box input` carries an id, which
           outranks a bare `:focus-visible` however far down the file it sits, so the
           general rule above lands on every control on the page EXCEPT the two this was
           written for. It has to be said again at least as specifically. */
        :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
        #login-box input:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

        /* WHEN THE SCREEN HAS ASKED FOR LESS MOVEMENT
           The overdue ticket pulses, once every 1.2 seconds, for as long as it is late
           — which on a bad Sunday is every card on the board, all afternoon, in the eye
           line of whoever is cooking. Reduce Motion is set by people who get a migraine
           from exactly that.

           Nothing is lost by stopping it: an overdue card is already a red border, a red
           background and a red elapsed time, so it is still the card that stands out
           without the animation carrying any of the meaning on its own. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>

</head>
<body>
    <div id="login-overlay" class="hidden">
        <!-- In a <template> on purpose: its contents are a detached fragment, so the
             password field is NOT in the document. iOS offers to fill a password field
             it finds in the DOM whether or not anything is showing it, and it did —
             on a till that was already signed in, mid-service. auth-gate.js clones this
             in the moment a sign-in is actually needed, and not before. -->
        <template id="login-box-template">
            <div id="login-box">
                <h2>Bar Display</h2>
                <input type="email" id="login-email" aria-label="Email" placeholder="Email" autocomplete="username">
                <input type="password" id="login-password" aria-label="Password" placeholder="Password" autocomplete="current-password">
                <button onclick="window.signInDisplay()">Sign In</button>
                <div id="login-error"></div>
            </div>
        </template>
    </div>

    <header>
        <img src="logo.png" alt="ILA Logo" class="logo" width="1200" height="427" decoding="async">
        <h1 class="header-title">Barista Display</h1>
        <div class="clock" id="live-clock">00:00</div>
    </header>

    <div class="kds-container" id="ticket-board">
        <div class="empty-state">
            <h2>No Orders</h2>
            <p>Waiting for tickets…</p>
        </div>
    </div>

    <div class="build-stamp" id="build-stamp"></div>
    <!-- Ours, in the order they ran in when they were in the head. Nothing here
         needs the SDK and the SDK needs nothing here; what needs both is the
         script at the end, which calls into whichever of these the page loads on
         its first pass. That is what keeps all of it synchronous and above it. -->
    <!-- Keeps a signed-in device signed in, and stops the login form being
         shown to somebody who is already signed in. See the top of the file. -->
    <script src="/auth-gate.js"></script>
    <!-- Watches for a newer deploy and offers a reload. This screen may be open
         all day, and the service worker only applies a new build on the next
         open. Keep data-build in step with build.json — npm test checks it. -->
    <script src="/build-check.js" data-build="2026-09-03.4"></script>
    <!-- Says so when this screen stops talking to the database. Every device here is
         on cafe wifi, and the failure is silent by construction: the last data stays
         on screen and new writes wait in memory. See connection.js. -->
    <script src="/connection.js"></script>

    <!-- The SDK. It lives here rather than in the head so that everything above it
         can be parsed and painted first; the preload tags up there start the
         download at the same moment the old head tags did. See the note beside
         them.

         Two things about this block must not change. It has to stay ABOVE the
         script below — that script calls firebase.initializeApp on its first
         working line — and these have to stay plain synchronous tags. Adding defer
         to them would be the one change that looks harmless and is not: deferred
         scripts run after the parser finishes, which is AFTER the inline script
         below has already run and already thrown on an undefined `firebase`. -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"
            integrity="sha384-rGbwvB6k85I5jkhcy5vYOSdABhBKcD9CHXb0RJIIuxMYVZatT6uul1faR/C5QI1U"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-database-compat.js"
            integrity="sha384-DVRvWnCIBtUIWOm6GpD+wukXwI8nijglXsBFYMlBIOgL5qBHlB8sa1CUlOftmd0R"
            crossorigin="anonymous"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"
            integrity="sha384-FlKYNHBedwGFdcKg5PNKA38dWBcbf9RzKO4qBmxO3DaDw5yuYP0DXikg/fgj4xID"
            crossorigin="anonymous"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAgUmy9NjbDnYXX_TBBjF8-qj36aW21qsQ",
            authDomain: "ila-cafe.firebaseapp.com",
            databaseURL: "https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ila-cafe",
            storageBucket: "ila-cafe.firebasestorage.app",
            messagingSenderId: "473595092965",
            appId: "1:473595092965:web:4ba6243e67b9ed0adb990c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // register the shared service worker (push + instant-open caching)
        if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js').catch(function(){}); } catch(e){} }

        // build-check.js publishes the build this page was deployed as.
        try { const _b = document.getElementById('build-stamp');
              if (_b) _b.textContent = 'build ' + (window.ILA_BUILD || '?'); } catch(e){}
        const auth = firebase.auth();
        let displayStarted = false;

        function escapeHTML(str) {
            return String(str == null ? "" : str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }
        // These delegate to auth-gate.js so that six pages cannot disagree about what a
        // login screen is — but they must not DEPEND on it. A same-origin script can still
        // fail to arrive on a cold cache, and a page whose whole inline script dies on the
        // first line is a till that will not open. So the gate is an enhancement: present,
        // it remembers the role and keeps the password field out of the way; absent, these
        // do exactly what they always did.
        const roleCache = window.ilaRole || { recall: () => null, remember: () => {}, forget: () => {} };
        function showLogin(msg) {
            if (window.ilaLoginBox) return window.ilaLoginBox.ready(msg);
            // Gate missing: clone the form in ourselves rather than reveal an empty box.
            const tpl = document.getElementById('login-box-template');
            const host = document.getElementById('login-overlay');
            if (tpl && host && !document.getElementById('login-box')) host.appendChild(tpl.content.cloneNode(true));
            host.classList.remove('hidden');
            const err = document.getElementById('login-error');
            if (err && msg) err.innerText = msg;
        }
        function hideLogin() {
            if (window.ilaLoginBox) return window.ilaLoginBox.hide();
            document.getElementById('login-overlay').classList.add('hidden');
            const err = document.getElementById('login-error');   // absent until the form is cloned in
            if (err) err.innerText = "";
        }
        // Before auth has resolved nothing is known, so nothing is asked for.
        if (window.ilaLoginBox) window.ilaLoginBox.checking();
        window.signInDisplay = function() {
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-password').value;
            document.getElementById('login-error').innerText = "Signing in...";
            auth.signInWithEmailAndPassword(email, pw).catch(() => { document.getElementById('login-error').innerText = "Sign-in failed. Check email and password."; });
        };

        // ===== overdue-order detection =====
        const KDS_SLA_MIN = 20;            // station service-time limit, in minutes
        window.kdsTickets = {};                 // id -> { start, qty }
        window.kdsAlarmed = {};                 // id -> true (already beeped)
        const KDS_STATION = 'barista';
        const ALERT_WORKER_URL = 'https://ila-push.sraveen-chirania.workers.dev/';
        // The relay authenticates the caller with a Firebase ID token, not with a
        // secret held by this page — a secret a browser has to hold is a secret
        // anyone can read out of view-source, and with the old one they could send
        // any notification they liked to every admin device. The token is signed by
        // Google, expires in an hour, and the Worker checks users/{uid}.role behind
        // it. Recipients come from the database, so they are not ours to send either.
        async function ilaPushBody(notification){
            const u = firebase.auth().currentUser;
            const token = u ? await u.getIdToken() : null;
            if (!token) return null;
            return JSON.stringify({ token: token, notification: notification });
        }
        async function kdsPushAlert(id, t){
            if (!ALERT_WORKER_URL) return;
            try {
                const res = await db.ref('orders/active/' + KDS_STATION + '/' + id).transaction(function(cur){ if (!cur) return cur; if (cur.pushedAt) return; cur.pushedAt = Date.now(); return cur; });
                if (!(res.committed && res.snapshot.exists())) return;
                const mins = Math.floor((Date.now() - t.start) / 60000);
                const body = (t.dest ? t.dest + ' \u00b7 ' : '') + (t.summary ? t.summary + ' \u00b7 ' : '') + mins + 'm late';
                const pushBody = await ilaPushBody({ title: '\u23f0 Order overdue', body: body, tag: 'late-' + id, url: '/admin.html' });
                if (!pushBody) return;
                await fetch(ALERT_WORKER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: pushBody });
            } catch (e) { console.error('push alert failed', e); }
        }
        // ===== SMART overdue threshold — fires relative to THIS drink order's realistic prep time =====
        // Drinks have NO oven; uses the barista saturation curve. Alarm = expected prep + PER-CATEGORY margin.
        window.etaModel = null;
        try { db.ref('eta/model').on('value', s => { const m=s.val(); if(m && m.itemBase) window.etaModel = m; }); } catch(e){}
        window.kdsLoadBarista = 0;
        try { db.ref('orders/active/barista').on('value', s => { window.kdsLoadBarista = s.numChildren(); }); } catch(e){}
        const KDS_ETA_DEF = {
            itemBase:{"espresso":3.6,"cortado":3.8,"americano":4.0,"iced americano":4.5,"cappuccino (large)":6.3,"cappuccino":5.3,"iced latte (large)":6.3,"iced latte":5.2,"latte":5.8,"flat white":6.5,"matcha":8.0,"iced matcha":8.5,"tea pot":4.4,"iced tea":5.2,"cold brew":4.0,"carrot cake":3.0,"banana bread":2.8,"rose cake":2.9},
            fallback:{pizza:7.5,hotfood:8.0,drink:5.5,baked:3.1},
            pizzaKeys:["margherita","funghi","burrata","formaggi","marc","pizza","fav","quattro","vodka"],
            bakedKeys:["cake","bread","banana"],
            satCurveBarista:[[0,0],[1,0],[3,4],[6,5],[7,8]],
            qtyCurve:[[1,0],[2,4],[4,9],[5,15]]
        };
        // Falls back per field, not wholesale. eta/model is taken as-is once it
        // loads, so a model that predates one of these curves — or an older snapshot
        // put back by the restore in analytics — would leave it undefined, and
        // etaInterp reads a missing curve as zero. The saturation or oven term would
        // silently vanish, the overdue threshold would come in short, and the board
        // would start flagging tickets early with nothing to say why. A kitchen that
        // learns to ignore the alarm is the real cost.
        //
        // Merged once per model, not once per call. This used to rebuild three objects
        // every time it was asked, and it is asked from etaItemBase — so a board of ten
        // tickets with four items each rebuilt them fifty-odd times, and kdsCheckOverdue
        // does that EVERY SECOND for as long as the screen is open. The merge cost
        // nothing on its own and a whole service of it is hours of pointless allocation
        // on a tablet that is never reloaded.
        //
        // Keyed on the model OBJECT, not a flag: eta/model is replaced wholesale by the
        // listener above, so a new object is a new model and anything else is the one
        // already merged. Nothing mutates these in place, so there is no third case.
        function etaCfg(){
            const m = window.etaModel;
            // The memo is kept ON this function, not in a variable beside it, because
            // the suites extract this function by itself and evaluate it — a companion
            // declaration would simply not exist there.
            if (etaCfg.val && etaCfg.src === m) return etaCfg.val;
            etaCfg.src = m;
            etaCfg.val = !m ? KDS_ETA_DEF : Object.assign({}, KDS_ETA_DEF, m, {
                fallback: Object.assign({}, KDS_ETA_DEF.fallback, m.fallback),
                itemBase: Object.assign({}, KDS_ETA_DEF.itemBase, m.itemBase)
            });
            return etaCfg.val;
        }
        function etaInterp(c,x){ if(!c||!c.length)return 0; if(x<=c[0][0])return c[0][1]; if(x>=c[c.length-1][0])return c[c.length-1][1]; for(let i=1;i<c.length;i++){ if(x<=c[i][0]){ const[a,b]=c[i-1],[d,e]=c[i]; return b+(e-b)*(x-a)/(d-a);} } return c[c.length-1][1]; }
        function etaItemBase(name){ const M=etaCfg(), n=(name||'').toLowerCase(); let best=null,bl=-1; for(const k in M.itemBase){ if(n.includes(k)&&k.length>bl){best=M.itemBase[k];bl=k.length;} } if(best!=null)return best; if(M.bakedKeys.some(k=>n.includes(k)))return M.fallback.baked; return M.fallback.drink; }
        function kdsExpectedPrep(items){
            const M=etaCfg();
            let base=0, qty=0;
            for(const nm in (items||{})){ const q=parseInt(items[nm].qty)||1; const b=etaItemBase(nm); if(b>base)base=b; qty+=q; }
            if(base===0&&qty===0) return null;
            let t=base + etaInterp(M.qtyCurve,qty);
            t += etaInterp(M.satCurveBarista, window.kdsLoadBarista||0);   // no oven term for drinks
            return t;
        }
        function kdsThresholdMs(qty, items){
            const exp = items ? kdsExpectedPrep(items) : null;
            if (exp != null) {
                const M=etaCfg(); let allBaked=true;
                for(const nm in (items||{})){ if(!M.bakedKeys.some(k=>nm.toLowerCase().includes(k))) allBaked=false; }
                const margin = allBaked ? 3 : 7;   // dessert p95 spread vs drink p95 spread
                return (exp + margin) * 60000;
            }
            return (20 + Math.min(Math.max(0, (qty||1) - 2) * 5, 20)) * 60000;  // fallback
        }
        function kdsQty(order){ let q = 0; if (order && order.items) { for (const k in order.items) { q += (parseInt(order.items[k].qty) || 0); } } return q || 1; }
        function kdsTicketStart(order){
            if (order && typeof order.createdAt === 'number') return order.createdAt;
            if (order && order.time) { const m = String(order.time).match(/(\d{1,2}):(\d{2})\s*([ap])m?/i); if (m) { const d = new Date(); let h = +m[1]; if (m[3]) { h = h % 12; if (/p/i.test(m[3])) h += 12; } d.setHours(h, +m[2], 0, 0); if (d.getTime() - Date.now() > 60000) d.setDate(d.getDate() - 1); return d.getTime(); } }
            return null;
        }
        function kdsBeep(){ try { const a = new (window.AudioContext || window.webkitAudioContext)(); const o = a.createOscillator(), g = a.createGain(); o.connect(g); g.connect(a.destination); o.type = 'square'; o.frequency.value = 880; g.gain.setValueAtTime(0.0001, a.currentTime); g.gain.exponentialRampToValueAtTime(0.35, a.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + 0.6); o.start(); o.stop(a.currentTime + 0.62); } catch (e) {} }
        // Runs once a second, forever, on a screen nobody ever reloads — so what it does
        // NOT do matters more than what it does.
        //
        // It used to look both elements up by id and write innerText on every pass. The
        // text is a whole number of minutes: fifty-nine of those sixty writes set it to
        // the string it already held, and each one is still a style and layout
        // invalidation on that card. The lookups were two getElementById per ticket per
        // second on top. Neither showed up as a stutter, and both were the tablet warm
        // and flat by mid-afternoon.
        //
        // Now: the nodes are held on the ticket (the board rebuild that created them is
        // what fills these in), and text and class are only written when the value
        // actually changes. The alarm and the overdue arithmetic are untouched — a
        // ticket still goes red and still beeps on the same second it always did.
        function kdsCheckOverdue(){
            const now = Date.now();
            for (const id in window.kdsTickets) {
                const t = window.kdsTickets[id]; if (!t || !t.start) continue;
                const age = now - t.start, over = age > kdsThresholdMs(t.qty, t.items), mins = Math.floor(age / 60000);
                if (t._el === undefined) t._el = document.getElementById('elapsed-' + id);
                if (t._card === undefined) t._card = document.getElementById('ticket-' + id);
                if (t._el) {
                    if (t._expM == null) { const e = kdsExpectedPrep(t.items); t._expM = (e!=null) ? Math.round(e) : null; }
                    // LATE IN WORDS, NOT ONLY IN RED. Overdue was a red border, a red tint,
                    // a red elapsed time and a pulse — four signals, all of them colour or
                    // motion. Reduce Motion correctly stops the pulse, which leaves a cook
                    // with colour alone, and colour alone is what WCAG 1.4.1 is about. It
                    // is also just hard to read: a tablet on a shelf, across a kitchen,
                    // under glare, with a red tint at 15% over brown. The word goes first
                    // because it is the thing to read first.
                    const txt = (over ? 'LATE \u00b7 ' : '') + mins + 'm' + (t._expM!=null ? ' / ~' + t._expM + 'm' : '');
                    if (txt !== t._txt) { t._txt = txt; t._el.innerText = txt; }
                }
                if (t._card && over !== t._over) { t._over = over; t._card.classList.toggle('overdue', over); }
                if (over && !window.kdsAlarmed[id]) { window.kdsAlarmed[id] = true; kdsBeep(); kdsPushAlert(id, t); }
            }
        }
        // Same again for the clock: it shows hours and minutes, so fifty-nine writes in
        // sixty put back the string that was already there.
        // Built once. The clock reads it every second for as long as the screen is
        // open, and toLocaleTimeString with an options object constructs a fresh
        // Intl.DateTimeFormat on every call — 64µs measured, against 2µs for one
        // that already exists. Skipping the WRITE when the minute has not changed
        // was only half of it: the string still had to be produced to find that
        // out, so a tablet was spending a few seconds of CPU a day formatting a
        // clock nobody was watching change.
        //
        // markOrderDone stamps its ticket in this same format and deliberately does
        // NOT use this constant. It is lifted out of the page and run on its own by
        // kds-done.test.js, so anything declared beside it is not there — and a DONE
        // tap happens a few times an hour, which is not a cost worth coupling a test
        // to a constant for.
        const KDS_CLOCK_FMT = new Intl.DateTimeFormat([], {hour: '2-digit', minute:'2-digit'});
        let _kdsClock = '';
        setInterval(() => {
            const now = KDS_CLOCK_FMT.format(new Date());
            if (now !== _kdsClock) { _kdsClock = now; document.getElementById('live-clock').innerText = now; }
            kdsCheckOverdue();
        }, 1000);

        auth.onAuthStateChanged(async (user) => {
            if (!user) { roleCache.forget(); showLogin(); return; }

            // What this device already knew about this uid. Enough to open on: the role
            // only decides which screen gets drawn, and database.rules.json decides every
            // read and write behind it. Waiting on the network to redraw the same screen
            // is the whole of the delay staff were reading as "it signed me out again".
            const known = roleCache.recall(user.uid);
            const admit = (p) => {
                hideLogin();
                if (!displayStarted) { displayStarted = true; startDisplay(); }
            };
            if (known) admit(known);

            try {
                const prof = (await db.ref('users/' + user.uid).once('value')).val();
                if (!prof || !prof.role) {
                    roleCache.forget();
                    await auth.signOut();
                    showLogin("This account has no access.");
                    return;
                }
                roleCache.remember(user.uid, prof);
                admit(prof);
            } catch (e) {
                // A read that failed says nothing about the account, so it must not put
                // anybody out. A device already open on a remembered role stays open; one
                // with nothing remembered is the only one that has to wait for an answer.
                if (!known) showLogin("Could not verify access. Check connection and retry.");
            }
        });

        // THE BOARD IS REDRAWN WHEN THE BOARD CHANGES, NOT WHEN THE NODE DOES
        //
        // Two things were wrong with rebuilding on every event, and the second is not a
        // performance problem at all.
        //
        // `board.innerHTML += card` per ticket is quadratic: += reads the whole board
        // back out as a string, appends, and reparses it, so ten tickets is ten parses
        // of a growing board and every card built so far is thrown away and remade. The
        // cards are accumulated into one string and assigned once instead.
        //
        // The one that could be seen: markOrderDone stamps doneAt on the ticket before
        // it clears it, and doneAt fires this listener. Nothing renders doneAt, so the
        // board that came back was identical — but rebuilding it replaced every node,
        // including the card markOrderDone had just started fading out. The fade was
        // wiped and the card snapped back to full opacity for the 200ms until the
        // remove landed, which reads as the DONE tap not registering. That is also the
        // moment somebody is most likely to tap again.
        //
        // So: build the markup, compare it with what is already on screen, and only
        // touch the DOM when it differs. Ticket start times go into the comparison too
        // because they are not in the markup — `time` is only accurate to the minute,
        // and createdAt is what the overdue clock actually counts from. When the board
        // is unchanged the existing kdsTickets are kept as they are, which is what
        // keeps the cached nodes and the last-rendered text on them valid.
        let _boardSig = null;
        function startDisplay() {
            db.ref('orders/active/barista').on('value', snap => {
                const orders = snap.val();
                const board = document.getElementById('ticket-board');
                if (!orders) {
                    if (_boardSig !== '') {
                        _boardSig = '';
                        board.innerHTML = `<div class="empty-state"><h2>No Orders</h2><p>Waiting for tickets…</p></div>`;
                    }
                    window.kdsTickets = {};
                    window.kdsAlarmed = {};
                    return;
                }
                let html = "";
                const tickets = {};
                const starts = [];
                for (let id in orders) {
                    const order = orders[id];
                    let itemsHTML = "";
                    if (order.items) {
                        for (let itemName in order.items) {
                            itemsHTML += `<div class="item-row"><span class="item-qty">${escapeHTML(order.items[itemName].qty)}x</span><span class="item-name">${escapeHTML(itemName)}</span></div>`;
                        }
                    }
                    let notesHTML = order.notes ? `<div class="ticket-notes">Notes: ${escapeHTML(order.notes)}</div>` : "";
                    html += `<div class="ticket-card" id="ticket-${id}"><div class="ticket-header"><div class="ticket-dest">${escapeHTML(order.destination)}</div><div class="ticket-meta"><span class="ticket-time">${escapeHTML(order.time)}</span><span>${escapeHTML(order.source)} &middot; <span class="ticket-elapsed" id="elapsed-${id}"></span></span></div></div><div class="ticket-items">${itemsHTML}</div>${notesHTML}<button class="btn-done" onclick="markOrderDone('${id}')">DONE</button></div>`;
                    const start = kdsTicketStart(order);
                    starts.push(id + ':' + start);
                    tickets[id] = { start: start, qty: kdsQty(order), dest: order.destination || '', items: order.items || {}, summary: order.items ? Object.keys(order.items).map(function(k){ return order.items[k].qty + '\u00d7 ' + k; }).join(', ') : '' };
                }
                const sig = html + '\u0000' + starts.join('\u0000');
                if (sig === _boardSig) return;                 // same board; leave the DOM alone
                _boardSig = sig;
                board.innerHTML = html;
                window.kdsTickets = tickets;
                for (const aid in window.kdsAlarmed) { if (!(aid in window.kdsTickets)) delete window.kdsAlarmed[aid]; }
                kdsCheckOverdue();
            });
        }

        // One DONE tap, however many times the button is pressed.
        //
        // This used to read the ticket and act on whatever it read. The card only fades
        // once that read comes back, so on a slow connection it is still on screen and
        // still tappable — and two taps both found the order and both did everything:
        // two bells at the counter, and stationsDone incremented twice. On a split order
        // that second increment is what tells the customer their order is ready while the
        // other station has not started it. Two screens open on this station is the same
        // story without the slow connection.
        //
        // Claim the ticket first, with the lock kdsPushAlert already uses on this node:
        // the tap that stamps doneAt owns it, and every other tap aborts. A guard on the
        // button could not do this — the second tap is often on another device.
        window.markOrderDone = function(id) {
            db.ref('orders/active/barista/' + id).transaction(function(cur){
                if (!cur) return cur;              // already cleared by the tap that won
                if (cur.doneAt) return;            // abort: another tap owns this ticket
                cur.doneAt = Date.now();
                return cur;
            }, function(err, committed, snapshot){
                if (err || !committed || !snapshot || !snapshot.exists()) return;
                const order = snapshot.val();
                if (!order) return;
                let summaryList = [];
                if(order.items) { for(let item in order.items) { summaryList.push(`${order.items[item].qty}x ${item}`); } }
                let summaryString = summaryList.join(", ");
                const readySignal = {
                    table: order.destination,
                    items: summaryString,
                    time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    timestamp: Date.now()
                };
                db.ref('orders/ready').push(readySignal);
                db.ref('orders/completed/barista/' + id).set({ ...order, completedAt: Date.now() });
                // mark track ready only when ALL stations for this order are done (handles split orders)
                if (order.trackId) {
                    try {
                        const tref = db.ref('orders/track/' + order.trackId);
                        tref.transaction(function(cur){
                            if(!cur) return cur;
                            cur.stationsDone = (cur.stationsDone||0) + 1;
                            if(cur.stationsDone >= (cur.stations||1)){ cur.status='ready'; cur.readyAt=Date.now(); }
                            return cur;
                        });
                    } catch(e){}
                }
                const ticket = document.getElementById('ticket-' + id);
                if(ticket) { ticket.style.opacity = '0'; ticket.style.transform = 'scale(0.95)'; ticket.style.transition = 'all 0.2s'; }
                setTimeout(() => { db.ref('orders/active/barista/' + id).remove(); }, 200);
            });
        };
    </script>
</body>
</html>
