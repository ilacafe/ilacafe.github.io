name: deploy worker

# The Worker deploys from here rather than from Cloudflare's own git integration,
# for one reason: when this fails, the log is somewhere it can be read and fixed.
# A Workers Build that never starts looks exactly like one that hasn't started yet,
# and nothing outside the Cloudflare dashboard can tell the difference.
#
# Only worker/ changes trigger it — a page edit has no business redeploying this.

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:        # and a button, for deploying without a code change

jobs:
  deploy:
    name: deploy ila-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail with a sentence a human can act on, rather than a wrangler stack trace.
      - name: check the API token is configured
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under"
            echo "::error::Settings > Secrets and variables > Actions > New repository secret."
            echo "::error::Create the token at Cloudflare > My Profile > API Tokens"
            echo "::error::using the 'Edit Cloudflare Workers' template."
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: install wrangler
        working-directory: worker
        run: npm install --no-audit --no-fund

      # Runtime secrets (VAPID_PRIVATE, ROBOT_PASSWORD, RECAL_SECRET, …) are NOT
      # set here. They live in the Worker's own settings and survive a deploy;
      # putting them in this repo's CI would be a second place to leak them from.
      - name: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # Names only — wrangler never prints secret values. This is the one check
      # that catches the failure mode nothing else does: a deploy succeeds, the
      # Worker runs, and a missing binding makes it fail closed in silence.
      - name: confirm the runtime secrets are present
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          have=$(npx wrangler secret list | tr -d ' "' | tr ',' '\n' | sed -n 's/^name://p')
          echo "$have"
          missing=""
          for s in VAPID_PRIVATE INGEST_SECRET RECAL_SECRET ROBOT_PASSWORD ROBOT_EMAIL VAPID_SUBJECT; do
            echo "$have" | grep -qx "$s" || missing="$missing $s"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing secret(s):$missing — the routes they guard will 401 and the crons will do nothing"
            exit 1
          fi
          echo "all required secrets present"
          # EMAIL_FORWARD_TO is deliberately not required: the code guards it, and
          # without it bank emails simply are not forwarded on.
          echo "$have" | grep -qx EMAIL_FORWARD_TO || echo "::warning::EMAIL_FORWARD_TO unset — bank emails will not be forwarded to an inbox"
