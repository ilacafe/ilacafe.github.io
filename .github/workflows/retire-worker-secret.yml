name: retire a worker secret

# Deleting a Cloudflare secret needs the Cloudflare API, which is not reachable from
# every environment that works on this repo. This runs it where the token already
# lives, so retiring a secret is a job that can be run and read rather than a note
# asking someone else to do it.
#
# Deliberately manual and deliberately typed: the secret's name is an input with no
# default, so nothing is ever deleted by a push.

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Exact name of the Worker secret to delete'
        required: true
      confirm:
        description: 'Type DELETE to confirm'
        required: true

jobs:
  retire:
    name: delete a secret from ila-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # The inputs reach the shell as environment variables, never as text pasted
      # into the script. A name of `x"; curl evil` is then an odd secret name and
      # nothing more.
      - name: refuse unless confirmed, and unless the code has stopped reading it
        env:
          SECRET_NAME: ${{ inputs.name }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "DELETE" ] || {
            echo "::error::confirm must be the word DELETE"; exit 1; }
          case "$SECRET_NAME" in
            *[!A-Za-z0-9_]*|'')
              echo "::error::a Worker secret name is letters, digits and underscores"
              exit 1 ;;
          esac
          # A secret still referenced by worker.js would take a route down with it.
          if grep -q "env\.${SECRET_NAME}\b" worker/worker.js; then
            echo "::error::worker.js still reads env.${SECRET_NAME} — deleting it would"
            echo "::error::leave that binding undefined and the route it guards would fail closed"
            exit 1
          fi
          echo "worker.js does not read ${SECRET_NAME}"

      # `secret delete` takes the name as a positional and finds the Worker in
      # wrangler.toml. It asks for confirmation interactively; on a runner there is
      # no terminal, and wrangler answers its own prompt with yes.
      #
      # What this job wants is the secret's absence, so a secret that was already
      # gone is the goal reached early, not a failure. Cloudflare says so with
      # error 10056, and only that one is forgiven — an expired token or a Worker
      # that does not exist still stops the job.
      - name: delete it
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ inputs.name }}
        run: |
          set -uo pipefail
          npm install --no-audit --no-fund || exit 1
          if npx wrangler secret delete "$SECRET_NAME" 2>&1 | tee /tmp/delete.log; then
            exit 0
          fi
          if grep -q "10056" /tmp/delete.log; then
            echo "::notice::${SECRET_NAME} was not bound to the Worker — nothing to delete"
            exit 0
          fi
          echo "::error::wrangler could not delete ${SECRET_NAME}"
          exit 1

      # A delete that quietly did nothing looks exactly like one that worked, so
      # the job only passes if the name is really gone from the live list.
      - name: prove it is gone
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SECRET_NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          npx wrangler secret list --format json > /tmp/secrets.json
          echo "--- secrets remaining ---"
          node -e '
            const raw = require("fs").readFileSync("/tmp/secrets.json", "utf8");
            // wrangler sends warnings to stderr, but be forgiving if one lands here.
            const start = raw.indexOf("[");
            if (start < 0) { console.log(raw); throw new Error("no secret list in wrangler output"); }
            const list = JSON.parse(raw.slice(start));
            const names = list.map(s => s.name).sort();
            for (const n of names) console.log("  " + n);
            if (names.includes(process.env.SECRET_NAME)) {
              console.log("::error::" + process.env.SECRET_NAME + " is still bound to the Worker");
              process.exit(1);
            }
            console.log("\n" + process.env.SECRET_NAME + " is gone.");
          '
