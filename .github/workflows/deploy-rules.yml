name: deploy database rules

# The rules are the only real security boundary in this project: every PIN prompt
# and role check inside a page is advice to a cooperating browser. They are also
# the one thing that does not deploy with a push, so the file in git and the rules
# actually enforced can drift apart with nothing to say so.
#
# This runs the deploy where a credential can live, and then reads the live rules
# back and diffs them, so a run that says it worked has checked that it did.
#
# Deliberately manual. Rules deploying automatically on a push would mean a bad
# commit could lock the till out of the database, or open it, with no one in the
# loop — a worse trade than the drift.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY to confirm'
        required: true

jobs:
  rules:
    name: deploy database.rules.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: refuse unless confirmed, and unless the rules are the ones tested
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "$CONFIRM" = "DEPLOY" ] || {
            echo "::error::confirm must be the word DEPLOY"; exit 1; }
          npm ci
          node test/rules.test.js
          echo "the rules in this commit pass their suite"

      # Without this the deploy step fails with an opaque auth error. Say what is
      # missing and what fixes it, once, rather than leaving a 403 to be decoded.
      - name: check the credential is here
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          if [ -z "$SA" ]; then
            echo "::error::Repository secret FIREBASE_SERVICE_ACCOUNT is not set."
            echo "::error::Firebase console -> Project settings -> Service accounts ->"
            echo "::error::Generate new private key. Paste the whole JSON file as that secret."
            exit 1
          fi
          echo "FIREBASE_SERVICE_ACCOUNT is present (${#SA} bytes)"

      # Before anything changes, keep a copy of what is live. The checks below run
      # after the deploy — they have to, since they are checking the deploy — so
      # without this a rules file that fails them is simply left in force, and
      # putting it back is a manual job at exactly the worst moment.
      - name: keep the rules that are live now
        id: save
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/verify-rules.js --save "$RUNNER_TEMP/rules-before.json"

      - name: deploy
        id: deploy
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only database --project ila-cafe --non-interactive

      # A deploy that reported success and changed nothing is the failure this whole
      # workflow exists to rule out. Read the live rules back and compare.
      # A deploy that reported success and changed nothing is the failure this whole
      # workflow exists to rule out. Read the live rules back and compare.
      #
      # The token is minted from the key itself (the jwt-bearer grant) rather than
      # with google-github-actions/auth, which impersonates the account through the
      # IAM Service Account Credentials API — off by default, and it failed here
      # with SERVICE_DISABLED. Turning that on for one read is a worse answer than
      # not needing it.
      - name: prove the live rules are these rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node tools/verify-rules.js

      # The step above proves the deployed text matches the file. This asks the
      # database the same question from outside, with no credentials — a condition
      # can be exactly what the file says and still permit the wrong thing, because
      # rules cascade and because reading a rule is not the same as predicting it.
      #
      # No secret: that is the point. It is the request an attacker would make.
      - name: and that they permit only what they should
        run: node tools/probe-rules.js

      # Only when something after the deploy went wrong. The rules being enforced
      # are the only real security boundary here, so the wrong ones staying live
      # while someone reads a failed workflow is not an acceptable resting state.
      #
      # This restores the exact bytes that were live before, then re-runs the same
      # outside probe against them — a rollback that is not itself checked is just
      # a second unverified deploy.
      - name: put the old rules back
        if: failure() && steps.save.outcome == 'success' && steps.deploy.outcome == 'success'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "::warning::a check after the deploy failed — restoring the rules that were live before it"
          cp "$RUNNER_TEMP/rules-before.json" database.rules.json
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@14 deploy --only database --project ila-cafe --non-interactive
          echo "restored. checking what is live now:"
          node tools/probe-rules.js
          echo "::error::the deploy was undone. database.rules.json in git is NOT what is live."
