<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8D6E52">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ILA POS">
    <title>ILA | POS</title>
    <link rel="apple-touch-icon" href="/icon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <style>
        :root { --brand-bg: #8D6E52; --brand-text: #ffffff; }
        #login-overlay { position: fixed; inset: 0; background: var(--brand-bg); z-index: 99999; display: flex; align-items: center; justify-content: center; padding: 20px; }
        #login-overlay.hidden { display: none; }
        #login-box { width: 100%; max-width: 320px; text-align: center; }
        #login-box h2 { letter-spacing: 3px; text-transform: uppercase; font-weight: 700; margin-bottom: 25px; }
        #login-box input { width: 100%; padding: 14px; margin: 8px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.4); background: transparent; color: #fff; font-family: 'Quicksand', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none; }
        #login-box button { width: 100%; padding: 14px; margin-top: 16px; border: none; border-radius: 8px; background: #fff; color: var(--brand-bg); font-weight: 700; font-size: 1.1rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        #login-error { color: #ffcfcf; font-size: 0.9rem; margin-top: 12px; min-height: 1.2em; }
        body { background-color: var(--brand-bg); color: var(--brand-text); font-family: 'Quicksand', sans-serif; margin: 0; padding: env(safe-area-inset-top) 0 0 0; line-height: 1.6; display: flex; flex-direction: column; align-items: center; padding-bottom: 120px; }
        .container { width: 90%; max-width: 600px; margin: 0 auto; padding: 20px; }
        header { text-align: center; margin-bottom: 25px; }
        .logo { max-width: 350px; height: auto; display: block; margin: 0 auto; }

        /* 5-ITEM DASHBOARD - Tuned to fit perfectly on mobile */
        .dashboard-bar { border: 1px solid rgba(255, 255, 255, 0.2); padding: 15px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .dash-stat { display: flex; flex-direction: column; align-items: center; cursor: pointer; flex: 1; transition: opacity 0.2s; }
        .dash-stat:active { opacity: 0.5; }
        .dash-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; opacity: 0.7; margin-bottom: 2px; font-weight: bold; }
        .dash-value { font-size: 1rem; font-weight: 700; }
        .dash-divider { width: 1px; height: 25px; background-color: rgba(255, 255, 255, 0.2); }

                /* NEW: Crisp Web Order Border Pulse */
        @keyframes crispBorderPulse {
            0% { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0); background-color: transparent; }
            50% { box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 1); background-color: rgba(255, 255, 255, 0.05); }
            100% { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0); background-color: transparent; }
        }
        .pulse-alert {
            animation: crispBorderPulse 1.5s infinite ease-in-out;
            border-radius: 6px;
        }


        h2 { font-weight: 700; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; text-align: center; margin-top: 20px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.2); padding-bottom: 10px; }
        
        .menu-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.1rem; font-weight: 500; }
        .item-name { flex-grow: 1; }
        
        .coffee-header { display: grid; grid-template-columns: 2fr 1fr 1fr; font-weight: bold; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px; opacity: 0.6; border-bottom: 1px dashed rgba(255, 255, 255, 0.2); padding-bottom: 5px; }
        .coffee-row { display: grid; grid-template-columns: 2fr 1fr 1fr; align-items: center; margin-bottom: 15px; font-size: 1.1rem; font-weight: 500; }
        
        .swap-container { display: flex; justify-content: flex-end; align-items: center; min-width: 76px; height: 32px; }
        
        .add-btn { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 4px; width: 32px; height: 32px; font-size: 1.4rem; font-weight: 400; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; padding: 0; }
        .add-btn:active { background-color: var(--brand-text); color: var(--brand-bg); }
        .add-btn:disabled { opacity: 0.2; cursor: not-allowed; border-color: transparent; }

        .qty-ctrl { display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; height: 32px; box-sizing: border-box; }
        .qty-btn { background: transparent; color: white; border: none; width: 26px; height: 100%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.2s; line-height: 1; }
        .qty-btn:active { background: white; color: var(--brand-bg); }
        .qty-num { width: 24px; text-align: center; font-weight: bold; font-size: 1.1rem; }

        .sold-out-badge { font-size: 0.65rem; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.3); padding: 2px 6px; border-radius: 4px; margin-left: 8px; text-transform: uppercase; font-weight: bold; }

        #cart-banner { position: fixed; bottom: 0; left: 0; width: 100%; background-color: var(--brand-text); color: var(--brand-bg); padding: 15px 20px calc(15px + env(safe-area-inset-bottom)); box-sizing: border-box; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(0,0,0,0.1); transform: translateY(100%); transition: transform 0.3s ease; z-index: 1000; }
        #cart-banner.visible { transform: translateY(0); }
        .cart-info { display: flex; flex-direction: column; cursor: pointer; }
        .cart-total { font-weight: 700; font-size: 1.1rem; }
        .cart-clear { font-size: 0.8rem; opacity: 0.7; }
        .checkout-btn { background-color: var(--brand-bg); color: var(--brand-text); border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; font-family: 'Quicksand', sans-serif; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;}

        #notification-area { position: fixed; top: calc(15px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: 90%; max-width: 350px; z-index: 3000; pointer-events: none; }
        
        .toast-card { background: var(--brand-bg); color: #fff; padding: 20px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); margin-bottom: 10px; font-family: 'Quicksand', sans-serif; display: flex; flex-direction: column; pointer-events: auto; animation: slideDown 0.3s ease-out; border-left: 5px solid #fff; }
        .toast-header { font-weight: 700; font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 6px; }
        .toast-details { font-size: 0.95rem; opacity: 0.9; margin-bottom: 15px; font-weight: 500; line-height: 1.4; }
        .toast-btn { background: transparent; color: #fff; border: 1px solid #fff; padding: 8px 0; border-radius: 4px; font-weight: bold; font-size: 0.8rem; cursor: pointer; text-transform: uppercase; width: 100%; transition: background 0.2s; }
        .toast-btn:active { background: rgba(255,255,255,0.15); }

        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--brand-bg); display: flex; justify-content: center; align-items: flex-start; padding-top: 5vh; box-sizing: border-box; z-index: 2000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
                /* ============================================================
           MODAL CARD — seamless brand surface with depth
           Same brand brown as the background; separation comes from a
           layered shadow plus a faint light edge. Interior keeps the
           app's standard white-on-brown styling.
           ============================================================ */
        .modal-content {
            background-color: var(--brand-bg); color: var(--brand-text);
            border: 1px solid rgba(255,255,255,0.22);
            box-shadow: 0 32px 80px rgba(0,0,0,0.55), 0 12px 32px rgba(0,0,0,0.40), 0 2px 8px rgba(0,0,0,0.30);
            padding: 24px 22px; border-radius: 14px; text-align: center;
            width: 85%; max-width: 400px; max-height: 88vh; overflow-y: auto;
        }
        .modal-content h3 { margin: 0 0 18px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1.5px; }
                
        .remark-input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid rgba(255,255,255,0.4); font-family: 'Quicksand', sans-serif; font-size: 1rem; background-color: transparent; color: white; display: block; box-sizing: border-box; outline: none;}
        .remark-input::placeholder { color: rgba(255,255,255,0.4); }
        
        .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .choice-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 12px 5px; border-radius: 6px; font-family: 'Quicksand', sans-serif; font-size: 0.9rem; text-transform: uppercase; cursor: pointer; font-weight: bold; transition: all 0.2s; flex: 1;}
        .choice-btn.selected { background: white; color: var(--brand-bg); border-color: white;}
        
        .table-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; }
        .table-btn { background-color: transparent; color: var(--brand-text); border: 1px solid rgba(255,255,255,0.4); padding: 15px 0; border-radius: 6px; font-weight: bold; font-size: 1.1rem; cursor: pointer; font-family: 'Quicksand', sans-serif; }
        .table-btn.occupied { background-color: #ffffff; color: #8D6E52; border: none;}
        .takeaway-btn { background-color: transparent; color: white; border: 1px solid rgba(255,255,255,0.4); padding: 15px 0; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; font-family: 'Quicksand', sans-serif; width: 100%; margin-bottom: 15px; text-transform: uppercase; transition: all 0.2s;}
        .takeaway-btn:active { background: white; color: var(--brand-bg); }

        .modal-buttons { display: flex; gap: 10px; justify-content: center; margin-top: 15px; margin-bottom: 15px; }
        .upi-status { min-height: 22px; font-size: 0.95rem; font-weight: 700; margin: 6px 0 2px; text-align: center; }
        .upi-status.waiting { color: #ffffff; animation: upiPulse 1.2s ease-in-out infinite; }
        .upi-status.verified { color: #6effa0; }
        @keyframes upiPulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
        .btn { padding: 12px 15px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; cursor: pointer; font-family: 'Quicksand', sans-serif; flex: 1; text-transform: uppercase; letter-spacing: 1px; border: none;}
        .btn-primary { background-color: var(--brand-text); color: var(--brand-bg); }
        .btn-secondary { background-color: transparent; color: var(--brand-text); border: 1px solid var(--brand-text); }
        .btn-dark { background-color: rgba(0,0,0,0.5); color: white; border: 1px solid rgba(255,255,255,0.2); }

        /* Staff-facing contact affordances on a web order card. The number was already being
           captured for takeaway/delivery and stored — these are what make it reachable. */
        .contact-row { display: flex; gap: 8px; margin-top: 10px; }
        .contact-btn { flex: 1; text-align: center; padding: 10px 6px; border-radius: 6px; text-decoration: none; font-weight: 700; font-size: 0.85rem; font-family: 'Quicksand', sans-serif; }
        .contact-call { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.35); color: #fff; }
        .contact-wa { background: #25D366; color: #fff; }
        
        /* Tip controls — same visual language as .choice-btn: transparent, thin light border,
           inverting to solid white when chosen. (These were briefly styled with .btn-action,
           which is an admin.html class and doesn't exist here, so they rendered as raw
           browser buttons.) */
        .tip-row { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
        .tip-btn { background: transparent; border: 1px solid rgba(255,255,255,0.4); color: var(--brand-text); border-radius: 6px; padding: 10px 0; flex: 1; font-family: 'Quicksand', sans-serif; font-size: 0.85rem; font-weight: bold; letter-spacing: 0.5px; cursor: pointer; transition: all 0.2s; }
        .tip-btn:active { background: var(--brand-text); color: var(--brand-bg); }
        .tip-btn.selected { background: var(--brand-text); color: var(--brand-bg); border-color: var(--brand-text); }
        .tip-btn.tip-clear { flex: 0 0 42px; }
        .tip-note { font-size: 0.8rem; opacity: 0.7; margin: -2px 0 10px; }

        .mini-btn { background-color: transparent; border: 1px solid rgba(255,255,255,0.4); color: white; border-radius: 4px; width: 28px; height: 28px; font-size: 1.2rem; cursor: pointer; margin: 0 5px; display: flex; align-items: center; justify-content: center; padding: 0; transition: all 0.2s; }
        .mini-btn:active { background-color: white; color: var(--brand-bg); }

        .close-modal { background: transparent; color: rgba(255,255,255,0.8); border: none; font-weight: bold; cursor: pointer; font-size: 0.85rem; font-family: 'Quicksand', sans-serif; margin-top: 20px; letter-spacing: 1px; padding: 10px;}

        .active-bill-item { border-bottom: 1px solid rgba(255,255,255,0.2); padding: 15px 5px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .bill-receipt { background-color: transparent; border: 1px solid rgba(255,255,255,0.2); color: white; padding: 15px; border-radius: 8px; text-align: left; margin-bottom: 15px; font-size: 0.9rem; }
        .bill-receipt-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px dashed rgba(255,255,255,0.2); padding-bottom: 8px; }
        .bill-receipt-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0;}
        .bill-grand-total { font-size: 1.2rem; font-weight: bold; text-align: right; margin-top: 10px; border-top: 1px solid white; padding-top: 10px;}
        .item-remove-x { color: rgba(255,255,255,0.5); font-weight: normal; font-size: 1.2rem; cursor: pointer; padding: 5px 12px 5px 0; }
        
        #qr-image { width: 150px; height: 150px; margin: 15px auto; border-radius: 8px; display: block; background: white; padding: 5px; }

        .ledger-box { border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 8px; padding: 10px; max-height: 200px; overflow-y: auto; text-align: left; margin-top: 15px; }
        .ledger-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding: 8px 0; font-size: 0.85rem; }
        .ledger-item:last-child { border-bottom: none; }
        .ledger-income { color: white; font-weight: bold; }
        .ledger-out { color: rgba(255, 255, 255, 0.6); }
        .ledger-meta { font-size: 0.75rem; opacity: 0.5; display: block; margin-top: 2px;}
    </style>
</head>
<body>
    <div id="login-overlay">
        <div id="login-box">
            <h2>ILA Staff</h2>
            <input type="email" id="login-email" placeholder="Email" autocomplete="username">
            <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
            <button onclick="window.signInStaff()">Sign In</button>
            <div id="login-error"></div>
        </div>
    </div>

    <div class="container">
        <header>
            <img src="logo.png" alt="ILA Logo" class="logo">
            <div id="offline-indicator" style="display:none; background:transparent; border: 1px solid rgba(255,255,255,0.5); color:white; opacity: 0.8; padding:5px; border-radius:4px; font-size:0.75rem; font-weight:bold; margin-top:15px; letter-spacing: 1px;">OFFLINE MODE</div>
        </header>

        <div id="notification-area"></div>

        <div class="dashboard-bar">
            <div class="dash-stat" onclick="openActiveBills()"><span class="dash-label">Bills</span><span class="dash-value" id="active-bills-count">0</span></div>
            <div class="dash-divider"></div>
            <div class="dash-stat" id="web-dash-stat" onclick="openWebOrders()"><span class="dash-label">Web</span><span class="dash-value" id="web-orders-count">0</span></div>
            <div class="dash-divider"></div>
            <div class="dash-stat" onclick="openCashManagement()"><span class="dash-label">Cash</span><span class="dash-value" id="cash-display">₹0</span></div>
            <div class="dash-divider"></div>
            <div class="dash-stat" onclick="openCashManagement()"><span class="dash-label">UPI</span><span class="dash-value" id="upi-display">₹0</span></div>
            <div class="dash-divider"></div>
            <div class="dash-stat" onclick="openPastBills()"><span class="dash-label">Shots</span><span class="dash-value" id="cups-display">0</span></div>
        </div>

        <div id="live-menu-container">
            <p style="text-align: center; opacity: 0.5; margin-top: 50px;">Loading...</p>
        </div>
    </div>

    <div id="cart-banner">
        <div class="cart-info" onclick="openReviewCartModal()"><span class="cart-total" id="cart-total-text">₹0</span><span class="cart-clear">View Items</span></div>
        <button class="checkout-btn" onclick="openTableModal()">Send Order</button>
    </div>

    <div id="web-orders-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Web Orders</h3>
            <div id="web-orders-list" style="margin-top: 15px; max-height: 400px; overflow-y: auto;"></div>
            <button class="close-modal" onclick="closeModal('web-orders-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="review-cart-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Cart</h3>
            <div id="review-cart-list" class="bill-receipt" style="max-height: 250px; overflow-y: auto; margin-top: 15px;"></div>
            <div class="modal-buttons"><button class="btn btn-secondary" onclick="clearCart()">Empty</button></div>
            <button class="close-modal" onclick="closeModal('review-cart-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="remark-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="remark-item-title">Item</h3>
            <div style="text-align: left; width: 100%; margin: 15px auto;">
                <label style="opacity: 0.7; font-size: 0.8rem; text-transform: uppercase;">Preferences</label>
                <div class="choice-grid" id="pos-sweetness-grid"></div>
            </div>
            <div class="modal-buttons">
                <button class="btn btn-secondary" onclick="closeModal('remark-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="confirmAddItem()">Add</button>
            </div>
            <button class="close-modal" onclick="closeModal('remark-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="table-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Send Order</h3>
            <div id="eta-estimate" style="text-align:center; font-size:0.95rem; font-weight:600; color:#6effa0; background:rgba(110,255,160,0.08); border:1px solid rgba(110,255,160,0.25); border-radius:8px; padding:10px; margin-bottom:12px; display:none;"></div>
            <textarea id="pos-order-notes" class="remark-input" placeholder="Order notes (e.g. To-go cup, extra hot...)" style="height: 50px; resize: none; margin-top: 5px; margin-bottom: 15px;"></textarea>
            
            <div class="table-grid" id="sender-table-grid"></div>
            <button class="takeaway-btn" onclick="sendOrder('Takeaway')">Takeaway</button><br>
            <button class="close-modal" onclick="closeModal('table-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="active-bills-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Open Tables</h3>
            <div id="active-bills-list" style="margin-top: 15px; max-height: 300px; overflow-y: auto;"></div>
            <button class="close-modal" onclick="closeModal('active-bills-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="past-bills-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>History</h3>
            <div id="past-bills-list" class="ledger-box" style="max-height: 300px; margin-top: 15px;"></div>
            <button class="close-modal" onclick="closeModal('past-bills-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="view-past-bill-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="past-bill-title">Receipt</h3>
            <p id="past-bill-date" style="font-size: 0.8rem; margin-top: -10px; margin-bottom: 15px; opacity: 0.6;"></p>
            <div id="past-bill-receipt" class="bill-receipt"></div>
            <input type="tel" id="past-bill-phone" class="remark-input" placeholder="Phone No." maxlength="10">
            <button class="btn btn-secondary" style="width: 100%; margin-top: 5px;" onclick="sendPastBillWhatsApp()">Send Receipt</button>
            <button class="close-modal" onclick="closeModal('view-past-bill-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="move-table-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Move To</h3>
            <div class="table-grid" id="move-table-grid"></div>
            <button class="takeaway-btn" onclick="window.confirmMoveTable('Takeaway')">Takeaway</button><br>
            <button class="close-modal" onclick="closeModal('move-table-modal')">✖ CANCEL</button>
        </div>
    </div>

    <div id="checkout-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="checkout-title">Bill</h3>
            <div id="checkout-receipt" class="bill-receipt" style="max-height: 35vh; overflow-y: auto;"></div>
            
            <input type="tel" id="checkout-phone" class="remark-input" placeholder="Phone No." maxlength="10">
            <button class="btn btn-secondary" style="width: 100%; margin-bottom: 15px;" onclick="sendWhatsAppBill()">Send Pay Link</button>
            
            <div class="modal-buttons">
                <button class="btn btn-dark" onclick="openSplitBill()">Split</button>
                <button class="btn btn-primary" onclick="payWithUPI(null)">UPI</button>
                <button class="btn btn-primary" onclick="payWithCash(null)">Cash</button>
            </div>
            <button class="close-modal" onclick="closeModal('checkout-modal')">✖ CLOSE</button>
        </div>
    </div>

    <div id="split-bill-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Split Bill</h3>

    <script>
        // --- NEW: AUDIO CHIME ENGINE ---
        // Browsers require a user interaction before playing audio.
        // We initialize it on the first tap the cashier makes.
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }
        document.addEventListener('click', initAudio, { once: true });
        document.addEventListener('touchstart', initAudio, { once: true });

        function playClassyChime() {
            if (!audioCtx) return;
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                // Creates a soft, pleasant "bell" frequency
                osc.type = 'sine';
                osc.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6 Note
                
                // Fades out gently over 0.8 seconds so it isn't jarring
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) { console.error("Chime failed", e); }
        }
        // -------------------------------

        const firebaseConfig = {
            apiKey: "AIzaSyAgUmy9NjbDnYXX_TBBjF8-qj36aW21qsQ",
            authDomain: "ila-cafe.firebaseapp.com",
            databaseURL: "https://ila-cafe-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ila-cafe",
            storageBucket: "ila-cafe.firebasestorage.app",
            messagingSenderId: "473595092965",
            appId: "1:473595092965:web:4ba6243e67b9ed0adb990c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        // register the shared service worker (push + instant-open caching)
        if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('/sw.js').catch(function(){}); } catch(e){} }

        /* ===== ILA ETA ENGINE (config-driven; numbers live in eta/model, no rebuild needed) ===== */
        /* ===================== ILA ETA ENGINE ===================== */
        (function(){
          // ---- 1. DEFAULT COEFFICIENTS (provisional, from reconstruction) ----
          // These seed eta/model on first run. Recalibration overwrites them later.
          // Everything the formula needs is here — change numbers here OR in Firebase, never the logic.
          const ETA_DEFAULTS = {
            version: 1,
            updatedAt: 0,
            // per-item HOT base times (minutes). Keys matched case-insensitively, substring.
            itemBase: {
              "margherita": 5.9, "marc": 7.3, "al funghi": 7.4, "pesto burrata": 8.7, "fire vodka": 7.3,
              "quattro": 8.0, "garlic bread": 8.0,
              "espresso": 3.6, "cortado": 3.8, "americano": 4.0, "iced americano": 4.5,
              "cappuccino (large)": 6.3, "cappuccino": 5.3, "iced latte (large)": 6.3, "iced latte": 5.2,
              "latte": 5.8, "flat white": 6.5, "matcha": 8.0, "iced matcha": 8.5,
              "tea pot": 4.4, "iced tea": 5.2, "cold brew": 4.0,
              "carrot cake": 3.0, "banana bread": 2.8, "rose cake": 2.9
            },
            // category fallbacks when an item isn't found above
            fallback: { pizza: 7.5, hotfood: 8.0, drink: 5.5, baked: 3.1 },
            // names that identify a pizza (for oven applicability + pizza fallback)
            pizzaKeys: ["margherita","funghi","burrata","formaggi","marc","pizza","fav","quattro","vodka"],
            bakedKeys: ["cake","bread","banana"],
            // oven cooling: minutes-since-last-pizza-out -> ADDED minutes (delta from hot base)
            // piecewise, interpolated. Last point plateaus.
            ovenCurve: [ [0,0],[10,0],[15,6],[20,6],[30,12],[45,14],[60,13],[120,13],[180,20] ],
            // saturation is STATION-SPECIFIC: orders-ahead-cooking -> ADDED minutes.
            // chef/pizza carries a floor (~+6) from overlapping pizzas the ahead-count under-captures.
            // barista/drinks has NO floor — a lone drink is just its base time.
            satCurveChef:    [ [0,7],[2,7],[4,10],[7,22],[8,23] ],
            satCurveBarista: [ [0,0],[1,0],[3,4],[6,5],[7,8] ],
            // quantity within a station: total items -> ADDED minutes
            qtyCurve:  [ [1,0],[2,4],[4,9],[5,15] ],
            // cushion — a CURVE evaluated live, not a flat number. The residual spread (how much to pad
            // for ~85% on-time) GROWS with conditions: a busy drink or a cooling-oven pizza is far less
            // predictable than a quiet/hot one. Data-derived:
            //   drinks: spread scales with LOAD  (quiet ~4 -> busy ~11)
            //   pizza:  spread scales with OVEN IDLE (hot ~4.7 -> cooling ~9)
            //   dessert: genuinely stable (~2) once 'served after food' excluded -> flat is correct here
            cushionDrinkByLoad: [ [0,4], [3,9], [5,11] ],
            cushionPizzaByOven: [ [0,4.7], [10,4.7], [20,9], [45,8], [60,7] ],
            cushionHotfood: 5,     // hot food: thin data, single sensible value
            cushionBaked: 2,       // desserts: data shows stable spread -> flat justified
            maxQuote: 32,       // never display more than this (min); overruns caught by overdue alarm
            rangeWidth: 5       // width of the displayed range
          };
        
          // ---- 2. LOAD CONFIG FROM FIREBASE (fall back to defaults), keep live ----
          window.etaModel = ETA_DEFAULTS;
          try {
            db.ref('eta/model').on('value', s => {
              const m = s.val();
              if (m && m.itemBase) window.etaModel = m;       // use live config when present
              else db.ref('eta/model').set(ETA_DEFAULTS);     // seed it once if empty
            });
          } catch(e){ /* offline: defaults stand */ }
        
          // ---- 3. HELPERS ----
          function interp(curve, x){            // piecewise-linear, plateau beyond ends
            if (!curve || !curve.length) return 0;
            if (x <= curve[0][0]) return curve[0][1];
            if (x >= curve[curve.length-1][0]) return curve[curve.length-1][1];
            for (let i=1;i<curve.length;i++){
              if (x <= curve[i][0]){
                const [x0,y0]=curve[i-1], [x1,y1]=curve[i];
                return y0 + (y1-y0)*(x-x0)/(x1-x0);
              }
            }
            return curve[curve.length-1][1];
          }
          function lc(s){ return (s||"").toLowerCase(); }
          function isPizza(name){ return window.etaModel.pizzaKeys.some(k=>lc(name).includes(k)); }
          function isBaked(name){ return window.etaModel.bakedKeys.some(k=>lc(name).includes(k)); }
          function itemBaseTime(name){
            const M = window.etaModel, n = lc(name);
            // exact-ish: longest matching key wins (so "cappuccino (large)" beats "cappuccino")
            let best=null, bestLen=-1;
            for (const k in M.itemBase){ if (n.includes(k) && k.length>bestLen){ best=M.itemBase[k]; bestLen=k.length; } }
            if (best!=null) return best;
            if (isPizza(name)) return M.fallback.pizza;
            if (isBaked(name)) return M.fallback.baked;
            return M.fallback.drink;
          }
        
          // ---- 4. LIVE SIGNALS (read from the running DB state) ----
          // load ahead per station = count of orders currently in orders/active/{station}
          window.etaLoad = { chef: 0, barista: 0 };
          window.etaLastPizzaOutMs = 0;
          try {
            db.ref('orders/active/chef').on('value', s => { window.etaLoad.chef = s.numChildren(); });
            db.ref('orders/active/barista').on('value', s => { window.etaLoad.barista = s.numChildren(); });
            // most recent pizza completion -> for oven idle. orders/ready carries items + timestamp.
            db.ref('orders/ready').limitToLast(40).on('value', s => {
              let last = 0;
              s.forEach(ch => {
                const v = ch.val()||{};
                if (v.items && isPizza(v.items) && v.timestamp && v.timestamp>last) last = v.timestamp;
              });
              if (last) window.etaLastPizzaOutMs = last;
            });
          } catch(e){}
        
          function serverNowSafe(){ return (typeof serverNow==='function') ? serverNow() : Date.now(); }
        
          // ---- 5. THE ESTIMATE ----
          // cartObj: { itemName: {qty, ...} }   (defaults to window.cart)
          // returns { low, high, point, label } minutes
          window.estimateETA = function(cartObj){
            const M = window.etaModel;
            const cart = cartObj || window.cart || {};
            const route = window.itemRoutingMap || {};
        
            // split items by station, track per-station slowest base + total qty + any pizza + baked-only
            const st = { chef:{base:0,qty:0,pizza:false,bakedOnly:true,has:false}, barista:{base:0,qty:0,pizza:false,bakedOnly:true,has:false} };
            let any=false;
            for (const name in cart){
              const qty = (cart[name].qty)||1;
              const station = route[name]==='chef' ? 'chef' : (route[name]==='barista' ? 'barista' : (isPizza(name)?'chef':'barista'));
              const b = itemBaseTime(name);
              if (b > st[station].base) st[station].base = b;   // slowest item sets the station floor (parallel)
              st[station].qty += qty;
              st[station].has = true;
              if (isPizza(name)) st[station].pizza = true;
              if (!isBaked(name)) st[station].bakedOnly = false;  // a non-baked item disqualifies baked-only
              any=true;
            }
            if (!any) return null;
        
            // per-station total = base + qty penalty + (oven if pizza) + saturation
            const idleMin = window.etaLastPizzaOutMs ? Math.max(0,(serverNowSafe()-window.etaLastPizzaOutMs)/60000) : 999;
            function stationTime(s, key){
              if (s.base===0 && s.qty===0) return 0;
              let t = s.base;
              t += interp(M.qtyCurve, s.qty);
              if (s.pizza) t += interp(M.ovenCurve, idleMin);
              const satCurve = (key==='chef') ? M.satCurveChef : M.satCurveBarista;
              t += interp(satCurve, (window.etaLoad[key]||0));
              return t;
            }
            // determine the DOMINANT category (the one driving the estimate) for cushion selection
            function categoryOf(s, isChef){
              if (s.pizza) return 'pizza';
              if (isChef) return 'hotfood';
              return 'drink';
            }
            // figure which station won, and whether its items are baked-only
            const chefT = stationTime(st.chef,'chef'), barT = stationTime(st.barista,'barista');
            let domCat;
            if (chefT >= barT && (st.chef.base>0||st.chef.qty>0)) {
              domCat = st.chef.pizza ? 'pizza' : 'hotfood';
            } else {
              // barista won (or only barista) — distinguish baked desserts from drinks
              domCat = st.barista.bakedOnly ? 'baked' : 'drink';
            }
            const point = Math.max(chefT, barT);
        
            // cushion: evaluated LIVE from the conditions that drive unpredictability (not a flat number).
            // pizza/hotfood -> by oven idle; drink -> by live load; dessert -> stable flat (data-justified).
            let cush;
            if (domCat === 'pizza' || domCat === 'hotfood') {
              cush = interp(M.cushionPizzaByOven || [[0,5]], idleMin);
              // heavy load adds a little more spread on top (pizza gets less predictable under backlog)
              const ld = window.etaLoad ? (window.etaLoad.chef||0) : 0;
              if (ld >= 5) cush += 2;
              if (domCat === 'hotfood') cush = M.cushionHotfood != null ? M.cushionHotfood : cush;
            } else if (domCat === 'baked') {
              cush = M.cushionBaked != null ? M.cushionBaked : 2;
            } else { // drink
              const ld = window.etaLoad ? (window.etaLoad.barista||0) : 0;
              cush = interp(M.cushionDrinkByLoad || [[0,4]], ld);
            }
            let quote = point + cush;
            quote = Math.min(quote, M.maxQuote||32);
        
            const low = Math.max(3, Math.round(quote - (M.rangeWidth||5)/2));
            const high = Math.round(quote + (M.rangeWidth||5)/2);
            return { low, high, point: Math.round(point), label: low + "–" + high + " min" };
          };
        })();
        /* =================== END ILA ETA ENGINE =================== */


        const auth = firebase.auth();
        // Device clocks drift. This is the server's clock minus this device's, in ms.
        // We add it whenever we need "true" now() — notably the UPI match window.
        window.serverTimeOffset = 0;
        db.ref('.info/serverTimeOffset').on('value', s => { window.serverTimeOffset = s.val() || 0; });
        function serverNow(){ return Date.now() + (window.serverTimeOffset || 0); }
        window.currentStaff = { uid: null, name: null, role: null };
        function showLogin(msg) {
            document.getElementById('login-overlay').classList.remove('hidden');
            if (msg) document.getElementById('login-error').innerText = msg;
        }
        function hideLogin() {
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('login-error').innerText = "";
        }
        window.signInStaff = function() {
            const email = document.getElementById('login-email').value.trim();
            const pw = document.getElementById('login-password').value;
            document.getElementById('login-error').innerText = "Signing in...";
            auth.signInWithEmailAndPassword(email, pw)
                .catch(() => { document.getElementById('login-error').innerText = "Sign-in failed. Check email and password."; });
        };
        window.signOutPOS = function() {
            if (confirm("Sign out of the POS?")) auth.signOut().then(() => location.reload());
        };
        let authedListenersStarted = false;
        auth.onAuthStateChanged(async (user) => {
            if (!user) { showLogin(); return; }
            try {
                const prof = (await db.ref('users/' + user.uid).once('value')).val();
                if (!prof || !prof.role) { await auth.signOut(); showLogin("This account has no staff access. Ask the admin."); return; }
                window.currentStaff = { uid: user.uid, name: prof.name || user.email, role: prof.role };
                hideLogin();
                if (!authedListenersStarted) { authedListenersStarted = true; startAuthedListeners(); }
            } catch (e) { showLogin("Could not verify access. Check connection and retry."); }
        });

        function startAuthedListeners() {
            db.ref('pos/activeTables').on('value', snap => {
                let data = snap.val() || {};
                if (Array.isArray(data)) {
                    window.activeTables = {};
                    data.forEach((val, idx) => { if(val) window.activeTables[idx.toString()] = val; });
                } else {
                    window.activeTables = data;
                }
                updateDashboards(); refreshActiveModals();
            });
            db.ref('pos/cashDrawer').on('value', snap => { window.cashDrawer = parseFloat(snap.val()) || 0; updateDashboards(); });
            db.ref('pos/upiTotal').on('value', snap => { window.upiTotal = parseFloat(snap.val()) || 0; updateDashboards(); });
            db.ref('upiReview').on('value', snap => { window.upiReviewMap = snap.val() || {}; renderLedger(); });
            startTipFeed();
            startVerificationReconciler();
            db.ref('pos/ledgerEntries').on('value', snap => {
                const data = snap.val() || {};
                window.salesLedgerMap = data;   // keep keyed form for reconciliation
                window.salesLedger = Object.values(data).sort((a, b) => (b.ts || 0) - (a.ts || 0));
                renderLedger();
                try { reconcileLedgerVerification(); } catch(e){}
            });
            db.ref('pos/bills').on('value', snap => {
                const data = snap.val() || {};
                window.pastBills = Object.values(data).sort((a, b) => (b.id || 0) - (a.id || 0));
                calculateDailyCups();
            });

            let previousWebOrderCount = 0;
            let isInitialWebOrderLoad = true;
            db.ref('orders/pendingWeb').on('value', snap => {
                window.pendingWebOrders = snap.val() || {};
                let count = Object.keys(window.pendingWebOrders).length;
                let countEl = document.getElementById('web-orders-count');
                countEl.innerText = count;
                countEl.style.opacity = count > 0 ? "1" : "0.5";
                let dashStat = document.getElementById('web-dash-stat');
                if (count > 0) { if (dashStat) dashStat.classList.add('pulse-alert'); }
                else { if (dashStat) dashStat.classList.remove('pulse-alert'); }
                if (!isInitialWebOrderLoad && count > previousWebOrderCount) { playClassyChime(); }
                previousWebOrderCount = count;
                isInitialWebOrderLoad = false;
                if(document.getElementById('web-orders-modal').classList.contains('active')) { window.openWebOrders(); }
                // matching runs from login, not from the modal — see sweepWebPayments()
                try { ensureWebVerifyFeeds(); sweepWebPayments(); } catch(e){}
                try { watchManualVerifyFlags(); } catch(e){}
            });

            // #5: when a customer's payment hasn't auto-confirmed in 120s, their app sets
            // needsManualVerify on the track record. Watch for it and push staff ONCE per order to
            // go verify manually. When they verify (paymentVerified set), the customer app reflects it.
            // The push carries the customer's number for takeaway/delivery, so whoever sees the
            // alert can chase it from the lock screen without digging the order out first.
            window._mvAlerted = {};
            function watchManualVerifyFlags(){
                for (const id in (window.pendingWebOrders || {})){
                    const o = window.pendingWebOrders[id]; if (!o || !o.trackId) continue;
                    const tid = o.trackId;
                    if (window._mvAlerted[tid]) continue;
                    db.ref('orders/track/' + tid + '/needsManualVerify').once('value', s => {
                        if (s.val() === true && !window._mvAlerted[tid]){
                            // only alert if still unverified
                            const matched = !!(window._wvMatch && window._wvMatch[id]);
                            if (matched) return;
                            window._mvAlerted[tid] = true;
                            const ph = o.phone ? ' \u00b7 \ud83d\udcde ' + o.phone : '';
                            posSendPush({ title: '⚠️ Web order still unpaid', body: (o.tableOrAddress||'Web order') + ' · ₹' + o.total + ph + ' — no payment matched yet. Send or resend the pay link, or check the bank.', tag: 'manualverify-' + tid, url: '/admin.html' });
                        }
                    });
                }
            }

            db.ref('staff').on('value', snap => { if(snap.val()) { window.staffPins = snap.val(); localStorage.setItem('ila_cached_staff', JSON.stringify(window.staffPins)); }});

            // ===== FORGOTTEN PAY LINK =====
            // Takeaway/delivery is prepaid, and the link only goes out when someone taps it.
            // A busy counter forgets. The customer's browser can't detect this (it doesn't know
            // whether staff sent anything) — the POS can, because sendPayLink stamps the order.
            // Alerts once per order, and only when no link was ever sent.
            window._plAlerted = {};
            setInterval(function(){
                const now = Date.now();
                for (const id in (window.pendingWebOrders || {})){
                    const o = window.pendingWebOrders[id]; if (!o) continue;
                    if (o.orderType === 'Dine-in') continue;          // settles at the table
                    if (o.payment && o.payment.ref) continue;        // already paid
                    if (o.payLinkSentAt) continue;                   // link went out; other alerts cover it

        // settings/upiList is a WEIGHTED list (VPAs repeated in proportion to remaining monthly

        // pick above therefore IS headroom-weighted routing. This block records confirmed money per
        // UPI per month, keeps the weighted list in sync, and alerts at 80% / 100% of a cap.
        function upiKey(vpa){ return String(vpa || '').trim().toLowerCase().replace(/[.#$\[\]\/]/g, '_'); }
        function upiMonthKey(){ const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
        function upiComputeWeights(config, totals){
            const entries = Object.keys(config || {}).map(k => { const c = config[k] || {}; return { key: k, id: c.id, label: c.label || c.id, cap: parseFloat(c.monthlyCap) || 0, active: c.active !== false, total: parseFloat((totals || {})[k]) || 0 }; }).filter(e => e.active && e.id);
            if (!entries.length) return [];
            const caps = entries.filter(e => e.cap > 0).map(e => e.cap);
            const maxCap = caps.length ? Math.max.apply(null, caps) : 0;
            const maxTotal = Math.max.apply(null, entries.map(e => e.total).concat([0]));
            const elig = [];
            for (const e of entries){
                if (e.cap > 0){ const hr = e.cap - e.total; if (hr > 0) elig.push({ e: e, w: hr }); }
                else { const w = maxCap > 0 ? Math.max(maxCap - e.total, maxCap * 0.1) : (maxTotal - e.total + 1000); elig.push({ e: e, w: w }); }
            }
            if (!elig.length){
                let best = null;
                for (const e of entries){ const over = e.total - e.cap; if (!best || over < best.over) best = { e: e, over: over }; }
                return best ? [{ e: best.e, w: 1 }] : [];
            }
            return elig;
        }

            const elig = upiComputeWeights(config, totals);

            if (elig.length === 1) return [elig[0].e.id];
            const sum = elig.reduce((a, x) => a + x.w, 0) || 1;
            const list = [];
            elig.forEach(x => { const slots = Math.max(1, Math.round(12 * x.w / sum)); for (let i = 0; i < slots; i++) list.push(x.e.id); });
            return list.slice(0, 24);
        }

                    // The badge already says whether the money has landed, so no separate

                        : '';

                        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">

                            <span id="wv-${id}"></span>
                        </div>
                        ${itemsHTML}
                        <strong style="font-size: 1.1rem;">Total: ₹${o.total}</strong>

        // Looks up each web order's phone against the repeat counter. Read per card on open
        // rather than subscribing to the whole customers node, which only grows.
        function renderCustomerBadges(){
            for (const id in (window.pendingWebOrders || {})){
                const o = window.pendingWebOrders[id]; if (!o || !o.phone) continue;
                const el = document.getElementById('cust-' + id); if (!el) continue;
                const cp = String(o.phone).replace(/\D/g, '').slice(-10);
                if (cp.length !== 10) continue;
                db.ref('customers/' + cp).once('value').then(snap => {
                    const c = snap.val(); const prior = (c && parseInt(c.orders)) || 0;
                    if (!prior) return;                       // first-timer: say nothing
                    const nth = prior + 1;
                    const suffix = (nth % 100 >= 11 && nth % 100 <= 13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[nth % 10] || 'th');
                    const last = c.lastAt ? new Date(c.lastAt).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '';
                    el.innerHTML = '<span style="display:inline-block; margin-top:8px; padding:3px 9px; border-radius:6px; font-size:0.75rem; font-weight:bold; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25);">\u2605 ' + nth + suffix + ' order' + (last ? ' \u00b7 last ' + escapeHTML(last) : '') + '</span>';
                }).catch(function(){});
            }
        }

        window.acceptWebOrder = function(id) {
            const order = window.pendingWebOrders[id];
            if (!order) return;
            if (!window._webActing) window._webActing = {};
            if (window._webActing[id]) return;              // already accepting/rejecting this one
            window._webActing[id] = true;
            setTimeout(function(){ delete window._webActing[id]; }, 3000);

            // Large-order gate: if this order is gated and payment is NOT yet verified, warn the
            // operator before starting the kitchen (guards against phantom bulk orders). They can
            // still override for a genuine case, but the default is to wait for the money.
            if (order.gated){
                const matched = !!(order.payment && order.payment.ref);
                if (!matched){
                    if (!confirm("Payment for this order is NOT yet verified.\n\nStart preparing anyway? (Recommended: wait until the badge shows the credit has landed.)")) return;
                }
            }

            try {
                dispatchToKitchen(order.items, order.tableOrAddress, order.notes || "", "Web App", order.trackId || null);
            } catch(e) { console.error("Kitchen dispatch error", e); }

            // A dine-in web order is not money yet — the customer settles on the POS QR at the
            // end, like any walk-in. Open it as a table instead of writing it into the ledger,
            // otherwise the day's UPI total counts cash that was never collected. Increments
            // mirror sendOrder() so two devices adding to one table can't overwrite each other.
            if (order.orderType === 'Dine-in'){
                const tid = String(order.tableOrAddress || '').replace(/\D/g, '') || 'Takeaway';
                for (const it in order.items){
                    db.ref('pos/activeTables/' + tid + '/items/' + it + '/price').set(order.items[it].price);
                    db.ref('pos/activeTables/' + tid + '/items/' + it + '/qty').set(firebase.database.ServerValue.increment(order.items[it].qty));
                }
                db.ref('pos/activeTables/' + tid + '/total').set(firebase.database.ServerValue.increment(parseFloat(order.total) || 0));
                if (order.notes) db.ref('pos/activeTables/' + tid + '/notes').transaction(c => c ? c + " | " + order.notes : order.notes);
                db.ref('orders/pendingWeb/' + id).remove();
                closeModal('web-orders-modal');
                return;
            }

            // Takeaway/delivery is prepaid. If the credit already landed it was booked the moment
            // it was matched (bookWebPayment) — booking again here would double-count the day.
            // Only an unpaid override needs an entry, and the reconciler flips it when the
            // credit arrives.
            if (!(order.payment && order.payment.ref)){
                // Not booked yet — this is a staff override on an unpaid order. Write it
                // unverified so it's on the books, and let the reconciler flip it if the
                // credit turns up later.
                (async () => {
                    let bankTag = null;
                    try {
                        const cfg = (await db.ref('upiRouting/config').once('value')).val() || {};
                        for (const k in cfg){ const c = cfg[k] || {}; const v = c.upi || c.vpa || c.id;
                            if (v && order.upiId && String(v).trim().toLowerCase() === String(order.upiId).trim().toLowerCase()){ bankTag = c.bank || null; break; } }
                    } catch(e){}
                    addLedgerEntry('upi_income', order.total, `Web: ${order.tableOrAddress}`, {
                        payId: 'web_' + (order.trackId || id),
                        state: 'unverified',
                        ref: null,
                        bankTag: bankTag
                    });
                })();
                if (order.upiId) { try { window.upiRecordPayment(order.upiId, parseFloat(order.total) || 0); } catch(e){} }
            }
            
            // phone travels onto the bill: once the pendingWeb record is removed the number would
            // otherwise be unreachable, and it's needed again to say "your takeaway is ready"
            // and to send the receipt without retyping it.
            const localBill = { 
                id: Date.now(), 
                table: "Web: " + order.tableOrAddress, 
                date: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) + ' - ' + new Date().toLocaleDateString(), 
                items: JSON.parse(JSON.stringify(order.items)), 
                total: order.total, 
                notes: order.notes || "",
                phone: order.phone || null
            };
            db.ref('pos/bills').push(localBill);
            calculateDailyCups();

            // Repeat-customer counter. The phone is the only identifier this café has ever had,
            // and until now it was captured and never used. Incremented on accept so the count
            // reflects orders actually served, not orders placed.
            try {
                const cp = String(order.phone || '').replace(/\D/g, '').slice(-10);
                if (cp.length === 10){
                    db.ref('customers/' + cp + '/orders').set(firebase.database.ServerValue.increment(1));
                    db.ref('customers/' + cp + '/lastAt').set(firebase.database.ServerValue.TIMESTAMP);
                    db.ref('customers/' + cp + '/lastSpend').set(parseFloat(order.total) || 0);
                }
            } catch(e){}

            const archivePacket = {
                timestamp: new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}),
                source: "Web App",
                orderType: "Delivery/Web",
                tableOrAddress: order.tableOrAddress,
                notes: order.notes || "",
                phone: order.phone || null,
                payment: { method: "UPI", total: order.total, verified: !!(order.payment && order.payment.ref), ref: (order.payment && order.payment.ref) || null },
                items: order.items
            };
            db.ref('orders/history/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)).set(archivePacket);
            db.ref('orders/pendingWeb/' + id).remove();
            closeModal('web-orders-modal');
        };

        window.rejectWebOrder = function(id) {
            const order = window.pendingWebOrders[id];
            if (!order) return;
            if (!window._webActing) window._webActing = {};
            if (window._webActing[id]) return;
            window._webActing[id] = true;
            setTimeout(function(){ delete window._webActing[id]; }, 3000);

            // Prepaid means a rejected order can ALREADY BE PAID. The money was booked the
            // moment the credit matched, so it is safely in the ledger either way — what
            // rejecting adds is a DEBT. Record it as a task with everything needed to pay it
            // back, instead of deleting the order and losing the trail.
            const paid = (order.payment && order.payment.ref) ? order.payment : null;
            const amt = paid ? (parseFloat(paid.amount) || parseFloat(order.total) || 0) : 0;
            const where = order.tableOrAddress || 'Web order';

            const msg = paid
                ? '\u26a0 THIS ORDER HAS BEEN PAID \u2014 \u20b9' + Math.round(amt) + '.\n\nRejecting it means you owe the customer a refund. It will be added to Refunds Due in Admin.\n\nReject anyway?'
                : 'Reject this web order?';
            if (!confirm(msg)) return;

            // tell the customer their order was declined (otherwise their app waits forever)
            if (order.trackId) {
                try { db.ref('orders/track/' + order.trackId).update({ status: 'rejected', refundDue: !!paid, rejectedAt: firebase.database.ServerValue.TIMESTAMP }); } catch(e){}
            }

            if (paid){
                // The income entry STAYS — the money really is in the account, and deleting it
                // would put the ledger out of step with the bank statement. The refund is a
                // separate outflow, written only when it is actually paid back (Admin).
                const rid = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
                db.ref('orders/refundsDue/' + rid).set({
                    amount: amt, phone: order.phone || null,
                    orderType: order.orderType || null, tableOrAddress: where,
                    items: order.items || null, notes: order.notes || null,
                    upiId: order.upiId || null, payId: paid.payId || null,
                    ref: paid.ref || null, bankTag: paid.bankTag || null,
                    trackId: order.trackId || null, status: 'due',
                    rejectedBy: (window.currentStaff && window.currentStaff.name) || 'staff',
                    createdAt: firebase.database.ServerValue.TIMESTAMP
                });
                posSendPush({ title: '\ud83d\udcb8 Refund due \u2014 \u20b9' + Math.round(amt), body: where + (order.phone ? ' \u00b7 ' + order.phone : '') + ' \u2014 a paid order was rejected. Refund the customer from Admin.', tag: 'refund-' + rid, url: '/admin.html' });
            }

            // A rejected order is a record, not a non-event — keep it in history either way.
            try {
                db.ref('orders/history/' + Date.now() + '-' + Math.random().toString(36).slice(2, 7)).set({
                    timestamp: new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}),
                    source: "Web App", orderType: order.orderType || "Web", tableOrAddress: where,
                    notes: order.notes || "", phone: order.phone || null,
                    rejected: true, refundDue: !!paid,
                    rejectedBy: (window.currentStaff && window.currentStaff.name) || 'staff',
                    payment: { method: "UPI", total: paid ? amt : 0, verified: !!paid, ref: paid ? paid.ref : null },
                    items: order.items || null
                });
            } catch(e){}

            db.ref('orders/pendingWeb/' + id).remove();
            delete window.pendingWebOrders[id];
            if(Object.keys(window.pendingWebOrders).length === 0) closeModal('web-orders-modal');
            else window.openWebOrders();
        };

        function saveLocalCart() {
            localStorage.setItem('ila_pos_cart', JSON.stringify(window.cart));
            localStorage.setItem('ila_pos_amount', window.totalAmount);
            localStorage.setItem('ila_pos_items', window.totalItems);

        function updateCartUI() {
            const banner = document.getElementById('cart-banner');
            if (window.totalItems > 0) { 
                document.getElementById('cart-total-text').innerText = `₹${Math.round(window.totalAmount)}`; 
                banner.classList.add('visible');

        window.getCartQty = function(baseName) {
            let qty = 0; let realBaseName = baseName.replace(/&quot;/g, '"').replace(/\\'/g, "'");
            for (let key in window.cart) {
                if (key === realBaseName || key.startsWith(realBaseName + " (")) { qty += window.cart[key].qty; }
            }
            return qty;
        };

        window.renderInlineControls = function() {
            const containers = document.querySelectorAll('.swap-container');
            containers.forEach(container => {
                let safeName = container.getAttribute('data-item');
                let price = container.getAttribute('data-price');
                let reqSweet = container.getAttribute('data-sweet') === 'true';
                let qty = window.getCartQty(safeName);

                if (qty > 0) {
                    container.innerHTML = `<div class="qty-ctrl"><button class="qty-btn" onclick="window.decrementInline('${safeName}')">-</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="window.promptRemark('${safeName}', ${price}, ${reqSweet})">+</button></div>`;
                } else {
                    container.innerHTML = `<span style="margin-right: 10px;">₹${price}</span><button class="add-btn" onclick="window.promptRemark('${safeName}', ${price}, ${reqSweet})">+</button>`;
                }
            });
        };

        window.decrementInline = function(safeName) {
            let realBaseName = safeName.replace(/&quot;/g, '"').replace(/\\'/g, "'");
            let targetKey = null;
            for (let key in window.cart) {
                if (key === realBaseName || key.startsWith(realBaseName + " (")) { targetKey = key; break; }
            }
            if (targetKey) {
                window.cart[targetKey].qty -= 1; window.totalAmount -= window.cart[targetKey].price; window.totalItems -= 1;
                if (window.cart[targetKey].qty <= 0) delete window.cart[targetKey];
                saveLocalCart(); 
                if (window.totalItems === 0) closeModal('review-cart-modal'); 
                else if (document.getElementById('review-cart-modal').classList.contains('active')) window.openReviewCartModal();
            }
        };

        let syncTimeout = null;
        function syncToCloud(tableID) {
            // Per-table write: two devices editing DIFFERENT tables touch different paths and
            // can't overwrite each other. (The old whole-map .set() is what lost orders.)
            if (typeof tableID !== 'undefined') {
                const t = window.activeTables[tableID];
                db.ref('pos/activeTables/' + tableID).set(t ? t : null).catch(e => console.error("Cloud Sync Error: ", e));
                return;
            }
            if (syncTimeout) clearTimeout(syncTimeout);
            syncTimeout = setTimeout(() => {
                db.ref('pos/activeTables').set(
                    Object.keys(window.activeTables).length > 0 ? window.activeTables : null
                ).catch(e => console.error("Cloud Sync Error: ", e));
            }, 600); 
        }

        function calculateDailyCups() {
            let cupTotal = 0;
            const startOfToday = new Date();
            startOfToday.setHours(0, 0, 0, 0);
            const startOfTodayMs = startOfToday.getTime();
            
            let coffeeKeys = Object.keys(window.coffeeItemsMap).sort((a,b) => b.length - a.length);

            window.pastBills.forEach(bill => {
                if(bill.id >= startOfTodayMs && bill.items) {
                    for(let itemName in bill.items) {
                        let matchedCoffee = coffeeKeys.find(key => itemName.startsWith(key));
                        if(matchedCoffee) {
                            let qty = bill.items[itemName].qty || 0;
                            if(itemName.includes("(Large)")) { cupTotal += (qty * 3); } 
                            else { cupTotal += (qty * 2); }
                        }
                    }
                }
            });
            document.getElementById('cups-display').innerText = cupTotal;
        }

        let currentMenuData = {}; let liveCategoryOrder = []; window.currentItemOrder = {};

        db.ref('.info/connected').on('value', function(snap) {

        db.ref('settings/itemOrder').on('value', snap => { window.currentItemOrder = snap.val() || {}; localStorage.setItem('ila_cached_item_order', JSON.stringify(window.currentItemOrder)); if(Object.keys(currentMenuData).length > 0) renderPOSMenu(currentMenuData, liveCategoryOrder); });
        
        db.ref('menu').on('value', snap => { 
            currentMenuData = snap.val() || {};

            window.itemRoutingMap = {};
            window.coffeeItemsMap = {}; 

            for(let cat in currentMenuData) {
                let isCoffeeCat = cat.toLowerCase().includes('coffee');

                for(let item in currentMenuData[cat]) {
                    let route = currentMenuData[cat][item].routing || 'barista';
                    window.itemRoutingMap[item] = route;
                    if(isCoffeeCat) window.coffeeItemsMap[item] = true;

                    if(currentMenuData[cat][item].hasSizes) {
                        window.itemRoutingMap[item + " (Regular)"] = route;
                        window.itemRoutingMap[item + " (Large)"] = route;
                        if(isCoffeeCat) window.coffeeItemsMap[item + " (Regular)"] = true;
                        if(isCoffeeCat) window.coffeeItemsMap[item + " (Large)"] = true;
                    }
                }
            }
            renderPOSMenu(currentMenuData, liveCategoryOrder);

        function renderPOSMenu(menuData, categoryOrder) {
            const container = document.getElementById('live-menu-container');
            if (!menuData) return;
            container.innerHTML = "";

            let activeCats = Object.keys(menuData);
            let sortedCats = categoryOrder.filter(cat => activeCats.includes(cat));
            activeCats.forEach(cat => { if(!sortedCats.includes(cat)) sortedCats.push(cat); });

            sortedCats.forEach(category => {
                let standardItems = []; let sizedItems = []; let hasVisibleItems = false;
                let itemsInOrder = window.currentItemOrder && window.currentItemOrder[category] ? window.currentItemOrder[category] : Object.keys(menuData[category]);
                
                itemsInOrder.forEach(itemName => {
                    const item = menuData[category] ? menuData[category][itemName] : null;
                    if (!item || item.visibility === 'customer') return; 
                    hasVisibleItems = true; item.originalName = itemName; 
                    if (item.hasSizes) { sizedItems.push(item); } else { standardItems.push(item); }
                });

                if (!hasVisibleItems) return;
                let catHTML = `<section><h2>${category}</h2>`;

                standardItems.forEach(item => {
                    const safeName = item.originalName.replace(/'/g, "\\'").replace(/"/g, "&quot;");
                    if (item.inStock) {
                        catHTML += `<div class="menu-row"><span class="item-name">${item.originalName}</span><div class="swap-container" data-item="${safeName}" data-price="${item.price || 0}" data-sweet="${item.requiresSweetness || false}"></div></div>`;
                    } else {
                        catHTML += `<div class="menu-row" style="opacity: 0.4;"><span class="item-name">${item.originalName} <span class="sold-out-badge">Out</span></span><div style="display:flex; justify-content:flex-end; align-items:center;"><span style="margin-right:10px;">₹${item.price || 0}</span><button class="add-btn" disabled>+</button></div></div>`;
                    }
                });

                if (sizedItems.length > 0) {
                    catHTML += `<div class="coffee-header"><div></div><div style="text-align: right;">Reg</div><div style="text-align: right;">Lrg</div></div>`;
                    sizedItems.forEach(item => {
                        let safeNameReg = (item.originalName + " (Regular)").replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        let safeNameLrg = (item.originalName + " (Large)").replace(/'/g, "\\'").replace(/"/g, "&quot;");
                        let regHTML = `<span class="sold-out-badge" style="margin:0; border:none;">-</span>`;
                        let lrgHTML = `<span class="sold-out-badge" style="margin:0; border:none;">-</span>`;

                        if (item.inStock) {
                            if(item.priceReg) regHTML = `<div class="swap-container" style="width:100%; justify-content:flex-end;" data-item="${safeNameReg}" data-price="${item.priceReg}" data-sweet="${item.requiresSweetness || false}"></div>`; else regHTML = '<div style="width:100%; text-align:right;">-</div>';
                            if(item.priceLrg) lrgHTML = `<div class="swap-container" style="width:100%; justify-content:flex-end;" data-item="${safeNameLrg}" data-price="${item.priceLrg}" data-sweet="${item.requiresSweetness || false}"></div>`; else lrgHTML = '<div style="width:100%; text-align:right;">-</div>';
                        }
                        catHTML += `<div class="coffee-row" style="${!item.inStock ? 'opacity: 0.4;' : ''}"><span>${item.originalName}</span>${regHTML}${lrgHTML}</div>`;
                    });
                }
                catHTML += `</section>`;
                container.innerHTML += catHTML;
            });
            window.renderInlineControls();
        }

        window.selectSweetness = function(val, price, btn) {
            window.currentModifierName = val;
            window.currentModifierPrice = price;
            let siblings = btn.parentNode.children;
            for(let s of siblings) s.classList.remove('selected');
            btn.classList.add('selected');
        };

        window.promptRemark = function(itemName, price, requiresSweetness = false) {
            let finalName = itemName.replace(/&quot;/g, '"');
            
            if (!requiresSweetness) {
                if (window.cart[finalName]) window.cart[finalName].qty += 1; 
                else window.cart[finalName] = { price: price, qty: 1 };
                window.totalAmount += parseFloat(price) || 0; 
                window.totalItems += 1;
                if (navigator.vibrate) navigator.vibrate(50);
                saveLocalCart();
                return;
            }

            const grid = document.getElementById('pos-sweetness-grid');
            grid.innerHTML = "";
            window.defaultModifiers.forEach((mod, index) => {
                let btn = document.createElement("button");
                btn.className = "choice-btn";
                let label = mod.price > 0 ? `${mod.name} (+₹${mod.price})` : mod.name;
                btn.innerText = label;
                btn.onclick = function() { window.selectSweetness(mod.name, mod.price, this); };
                if(index === 0) { 
                    btn.classList.add('selected'); 
                    window.currentModifierName = mod.name;
                    window.currentModifierPrice = mod.price;
                }
                grid.appendChild(btn);
            });

            window.pendingItemName = itemName; 
            window.pendingItemPrice = price; 
            window.isBeveragePending = requiresSweetness;
            document.getElementById('remark-item-title').innerText = finalName; 
            document.getElementById('remark-modal').classList.add('active');
        };

        window.confirmAddItem = function() {
            let finalName = window.pendingItemName.replace(/&quot;/g, '"');

            else { window.cart[finalName] = { price: finalPrice, qty: 1 }; }
            
            window.totalAmount += finalPrice; 
            window.totalItems += 1;
            saveLocalCart(); closeModal('remark-modal');
        };

        window.modifyCartItem = function(item, delta) {
            let realItemName = item.replace(/&quot;/g, '"');
            if (window.cart[realItemName]) {
                window.cart[realItemName].qty += delta; window.totalAmount += (parseFloat(window.cart[realItemName].price) * delta); window.totalItems += delta;
                if (window.cart[realItemName].qty <= 0) delete window.cart[realItemName];

        function dispatchToKitchen(cartObj, destination, notes, source, trackId) {
            let baristaItems = {}; let chefItems = {};
            for (let itemName in cartObj) {
                let baseName = itemName.split(" (")[0]; 
                let routing = window.itemRoutingMap[baseName] || 'barista';
                if(routing === 'chef') { chefItems[itemName] = cartObj[itemName]; } 
                else { baristaItems[itemName] = cartObj[itemName]; }
            }
            const timeStr = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            // every order gets a track record (POS-entered orders too) so a table-scan can find its status.
            if (!trackId) trackId = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
            const extra = { trackId: trackId };
            if (Object.keys(baristaItems).length > 0) {
                db.ref('orders/active/barista').push(Object.assign({ items: baristaItems, destination: destination, notes: notes, source: source, time: timeStr, createdAt: firebase.database.ServerValue.TIMESTAMP }, extra));
            }
            if (Object.keys(chefItems).length > 0) {
                db.ref('orders/active/chef').push(Object.assign({ items: chefItems, destination: destination, notes: notes, source: source, time: timeStr, createdAt: firebase.database.ServerValue.TIMESTAMP }, extra));
            }
            // track record: status starts at 'preparing' here (it's being dispatched to the kitchen now).
            // Record how many stations this order spans, so it only shows 'ready' when ALL are done.
            const stationCount = (Object.keys(chefItems).length>0?1:0) + (Object.keys(baristaItems).length>0?1:0);
            // log the prediction + live conditions for later predicted-vs-actual monitoring (joins with readyAt)
            let predBlock = {};
            try {
                const _eta = window.estimateETA ? window.estimateETA(cartObj) : null;
                if (_eta) {
                    predBlock = {
                        predLow: _eta.low, predHigh: _eta.high, predPoint: _eta.point,
                        predOvenIdleMin: (window.etaLastPizzaOutMs ? Math.round(Math.max(0,(Date.now()-window.etaLastPizzaOutMs)/60000)) : null),
                        predLoadChef: (window.etaLoad ? window.etaLoad.chef : null),
                        predLoadBarista: (window.etaLoad ? window.etaLoad.barista : null),
                        predModelVersion: (window.etaModel ? window.etaModel.version : null)
                    };
                }
            } catch(e){}
            try {
                db.ref('orders/track/' + trackId).update(Object.assign({
                    status: 'preparing', items: cartObj, table: destination,
                    stations: stationCount, stationsDone: 0,
                    acceptedAt: firebase.database.ServerValue.TIMESTAMP
                }, predBlock));
            } catch(e){}
            return trackId;
        }

        window.sendOrder = function(tableID) {
            if (window.totalItems === 0) return alert("Cart is empty!");
            // Double-tap guard. The table total uses increment(), so a second tap on a laggy
            // connection sends a second kitchen ticket AND charges the table twice. Neither is
            // recoverable without a void.
            if (window._sendingOrder) return;
            window._sendingOrder = true;
            setTimeout(function(){ window._sendingOrder = false; }, 2500);
            
            const notes = document.getElementById('pos-order-notes').value.trim().replace(/</g, "&lt;").replace(/>/g, "&gt;");
            let destName = tableID === 'Takeaway' ? 'Takeaway' : 'Table ' + tableID;
            
            try {
                dispatchToKitchen(window.cart, destName, notes, "POS");
            } catch(e) { console.error("Kitchen dispatch error", e); }

            if (!window.activeTables[tableID]) window.activeTables[tableID] = { items: {}, total: 0, paid: 0, notes: "" };
            
            if (notes) {
                if (window.activeTables[tableID].notes) window.activeTables[tableID].notes += " | " + notes;
                else window.activeTables[tableID].notes = notes;
            }

            for (let item in window.cart) {
                if (window.activeTables[tableID].items[item]) window.activeTables[tableID].items[item].qty += window.cart[item].qty;
                else window.activeTables[tableID].items[item] = { price: window.cart[item].price, qty: window.cart[item].qty };
            }
            
            let safeTotal = parseFloat(window.totalAmount) || 0;
            window.activeTables[tableID].total = (parseFloat(window.activeTables[tableID].total) || 0) + safeTotal;

            // Atomic per-item writes: if two devices add to the SAME table at once, qty and total
            // INCREMENT (both orders kept) instead of one overwriting the other. The local update
            // above is just instant on-screen feedback; the listener reconciles to the cloud value.
            for (let it in window.cart) {
                db.ref('pos/activeTables/' + tableID + '/items/' + it + '/price').set(window.cart[it].price);
                db.ref('pos/activeTables/' + tableID + '/items/' + it + '/qty').set(firebase.database.ServerValue.increment(window.cart[it].qty));
            }
            db.ref('pos/activeTables/' + tableID + '/total').set(firebase.database.ServerValue.increment(safeTotal));
            if (notes) db.ref('pos/activeTables/' + tableID + '/notes').transaction(c => c ? c + " | " + notes : notes);
            
            closeModal('table-modal'); 
            window.clearCart();
        };
