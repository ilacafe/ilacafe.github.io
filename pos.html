        window.removeTableItem = async function(tableID, itemName) {
            let realItemName = itemName.replace(/&quot;/g, '"');
            const tableData = window.activeTables[tableID];
            
            if(tableData && tableData.items[realItemName]) {
                const reason = prompt(`Removing ${realItemName}. Reason?`);
                if (!reason) return; 

                const voidPin = prompt("Staff PIN to authorize this void:");
                if (!voidPin) return;
                const authName = window.staffPins[await hashPin(voidPin)];
                if (!authName) { alert("Invalid PIN — void cancelled."); return; }

                const voidData = {
                    time: new Date().toLocaleString(),
                    ts: Date.now(),
                    table: tableID,
                    item: realItemName,
                    value: tableData.items[realItemName].price,
                    reason: reason,
                    by: authName,
                    device: (window.currentStaff && window.currentStaff.name) ? window.currentStaff.name : "Unknown",
                    deviceUid: (window.currentStaff && window.currentStaff.uid) ? window.currentStaff.uid : ""
                };
                db.ref('security/voids').push(voidData);
                posSendPush({ title: '\u26a0\ufe0f Void', body: voidData.item + ' \u20b9' + Math.round(voidData.value) + ' \u00b7 ' + (tableID.startsWith('Takeaway') ? tableID : 'Table ' + tableID) + ' \u00b7 by ' + voidData.by + (reason ? ' \u2014 ' + reason : ''), tag: 'void-' + voidData.ts, url: '/admin.html' });

                let destName = tableID.startsWith('Takeaway') ? tableID : 'Table ' + tableID;
                let voidCart = {};
                voidCart[realItemName] = { price: 0, qty: "❌ -1" }; 
                try {
                    dispatchToKitchen(voidCart, destName, `VOID / CANCELLED. Reason: ${reason}`, "POS Update");
                } catch(e) { console.error("Kitchen dispatch error", e); }

                tableData.total = (parseFloat(tableData.total) || 0) - (parseFloat(tableData.items[realItemName].price) || 0); 
                tableData.items[realItemName].qty -= 1;
                if(tableData.items[realItemName].qty <= 0) delete tableData.items[realItemName];
                
                let paid = parseFloat(tableData.paid) || 0;
                let newTotal = parseFloat(tableData.total) || 0;

                if(Object.keys(tableData.items).length === 0) { 
                    delete window.activeTables[tableID]; syncToCloud(tableID); closeModal('checkout-modal'); return; 
                }
                if(paid >= newTotal && paid > 0) {
                     archivePOSTable(tableID, tableData, "Partial/Cleared");
                     delete window.activeTables[tableID]; syncToCloud(tableID); closeModal('checkout-modal'); return;
                }
                syncToCloud(tableID);
            }
        };

        window.payWithCash = function(customAmount = null) {

            const tableData = window.activeTables[window.checkoutTableID];
            
            let total = parseFloat(tableData.total) || 0;
            let paid = parseFloat(tableData.paid) || 0;

            amountToPay = amountToPay || 0;

            addLedgerEntry('cash_income', amountToPay, reason);

        window.payWithUPI = function(customAmount = null) {
            window.currentPaymentMethod = "UPI";
            const tableData = window.activeTables[window.checkoutTableID];
            
            let total = parseFloat(tableData.total) || 0;
            let paid = parseFloat(tableData.paid) || 0;
            let remaining = total - paid;

            let amountToPay = customAmount !== null ? parseFloat(customAmount) : remaining;
            amountToPay = amountToPay || 0;
            
            // base = what the bill needs. Tip rides on top and is re-rendered without
            // re-rolling the VPA, so attribution and the bank/account filter stay stable.
            window.upiBaseAmount = amountToPay;
            window.pendingTip = 0;
            window.tableUPIVPA[window.checkoutTableID] = window.getRandomUPI();

            closeModal('checkout-modal'); closeModal('split-bill-modal'); document.getElementById('upi-modal').classList.add('active');
            window.renderUPIQR();
        };

        // Rebuilds the QR for base+tip and restarts the watcher on the NEW amount. It has to be
        // one amount on one QR: the bank credit is matched to the ledger entry to within 50 paise
        // in four places, so a tip the customer adds freehand on top of a fixed-amount QR would
        // silently stop that payment ever auto-verifying.
        window.renderUPIQR = function(){
            const base = parseFloat(window.upiBaseAmount) || 0;
            const tip = parseFloat(window.pendingTip) || 0;
            const total = Math.round((base + tip) * 100) / 100;
            window.pendingUPIAmount = total;
            const vpa = window.tableUPIVPA[window.checkoutTableID] || window.getRandomUPI();
            const upiString = `upi://pay?pa=${vpa}&pn=ILA&am=${total}&cu=INR`;
            document.getElementById('qr-image').src = `https://quickchart.io/qr?size=250&text=${encodeURIComponent(upiString)}`;
            document.getElementById('upi-amount-text').innerText = `₹${total}`;
            const line = document.getElementById('upi-tip-line');
            const clr = document.getElementById('upi-tip-clear');
            if (tip > 0){ line.style.display = 'block'; line.innerText = '\u20b9' + base + ' bill + \u20b9' + tip + ' tip'; if (clr) clr.style.display = ''; }
            else { line.style.display = 'none'; if (clr) clr.style.display = 'none'; }
            // reflect the chosen preset, the way the sweetness grid does
            document.querySelectorAll('.tip-btn[data-tip]').forEach(function(b){
                const v = b.getAttribute('data-tip');
                const on = (v === 'custom') ? (tip > 0 && [10,20,50].indexOf(tip) === -1) : (tip === parseFloat(v));
                b.classList.toggle('selected', !!on);
            });
            startUPIWatch(total);   // also invalidates the previous amount's watcher
        };

        // Presets SET the tip rather than adding to it, and tapping the chosen one clears it —
        // same exclusive-choice behaviour as the sweetness buttons, so there is one interaction
        // model in the app instead of two.
        window.setTip = function(v){
            const cur = parseFloat(window.pendingTip) || 0;
            if (v === 'custom'){
                const raw = prompt('Tip amount (\u20b9):', cur ? String(cur) : '');
                if (raw === null) return;
                const n = parseFloat(raw);
                if (isNaN(n) || n < 0) return alert('Enter a valid amount.');
                window.pendingTip = n;
            } else if (v === 0){
                window.pendingTip = 0;
            } else {
                window.pendingTip = (cur === v) ? 0 : v;   // tap again to clear
            }
            window.renderUPIQR();
        };

        // ---- UPI auto-verification ------------------------------------------
        // While the QR is on screen we watch payments/incoming for a credit of
        // the exact amount that landed in this window. The first device to CLAIM
        // a credit (atomic transaction on payments/claims/{ref}) owns it, so one
        // payment can never confirm two orders. Manual "Confirm Payment" stays as
        // the fallback for the slow tail and accounts that don't alert in time.
        function setUPIStatus(state, info){
            const el = document.getElementById('upi-status'); if(!el) return;
            if (state === 'waiting'){ el.className = 'upi-status waiting'; el.innerText = '● Waiting for payment…'; }
            else if (state === 'verified'){ el.className = 'upi-status verified'; el.innerText = '✓ Received' + (info && info.payer ? ' — ' + info.payer : '') + ' · ₹' + (info ? info.amount : ''); }
            else { el.className = 'upi-status'; el.innerText = ''; }
        }
        // The watcher attaches with on('value'). Detaching with a DIFFERENT event type is a
        // no-op, so every QR opened used to leave a live handler on payments/incoming forever —
        // each closing over its own amount. A late bank credit then woke every one of those
        // ghosts, and the first with a matching amount claimed it and settled against whatever
        // table happened to be open. That is why a late email sometimes never verified the
        // entry it belonged to: something else had already taken the credit.
        // Two defences: detach correctly, AND stamp each watch with a session number so a
        // handler that somehow survives can still never act.
        window.upiWatchSession = 0;
        function stopUPIWatch(){
            window.upiWatchSession++;   // invalidates any handler still attached
            if (window.upiWatchRef){ try { window.upiWatchRef.q.off('value', window.upiWatchRef.handler); } catch(e){} window.upiWatchRef = null; }
        }
        function startUPIWatch(amount){
            stopUPIWatch();
            window.upiSettling = false; window.upiMatchedInfo = null;
            setUPIStatus('waiting');
            try { db.ref('upiRouting/config').once('value', s => { window._upiCfgCache = s.val() || {}; }); } catch(e){}
            // Scan recent credits by VALUE (not child_added). child_added with a startAt
            // lower-bound silently misses a credit whose `at` predates the window — which
            // happens whenever the QR is opened more than the tolerance after the customer
            // actually paid, or when the worker's clock skews below the POS clock. Here we
            // re-scan the last 60 credits on every change and match on amount + bank; the
            // atomic claim prevents double-settlement, and a credit is only considered if it
            // arrived within the last 30 min (loose sanity bound, never a tight tripwire).
            const q = db.ref('payments/incoming').orderByChild('at').limitToLast(60);
            const mySession = window.upiWatchSession;
            const myTable = window.checkoutTableID;
            const handler = snap => {
                if (mySession !== window.upiWatchSession) return;      // this watch is over
                if (window.upiSettling) return;
                // Don't claim on behalf of a table that has since been settled or cleared —
                // claiming there consumes the credit and then settleUPI returns early, leaving
                // it claimed with nothing booked against it.
                if (window.checkoutTableID !== myTable || !window.activeTables[myTable]) return;
                const now = serverNow();
                const cands = [];
                snap.forEach(ch => {
                    const p = ch.val(); if (!p) return;
                    if (Math.abs((parseFloat(p.amount)||0) - amount) >= 0.5) return;   // amount must match
                    if (!window.upiBankCompatible(p)) return;                          // credit's bank/acct must match this table's VPA
                    const at = p.at || 0;
                    if (at && at < now - 30*60000) return;                             // ignore anything older than 30 min
                    cands.push({ key: ch.key, p, at });
                });
                if (!cands.length) return;
                cands.sort((a,b) => b.at - a.at);   // newest first
                const tryNext = i => {
                    if (mySession !== window.upiWatchSession) return;
                    if (window.upiSettling || i >= cands.length) return;
                    claimPayment(cands[i].key, cands[i].p, won => {
                        if (mySession !== window.upiWatchSession) return;
                        if (won && !window.upiSettling) autoConfirmUPI({ ref:cands[i].key, payer:cands[i].p.payer||null, amount:cands[i].p.amount, source:cands[i].p.source||null });
                        else tryNext(i+1);
                    });
                };
                tryNext(0);
            };
            q.on('value', handler);
            window.upiWatchRef = { q, handler };
        }
        function claimPayment(ref, p, cb, fixedToken){
            // fixedToken: a stable, order-derived token (web orders). If the tab dies between
            // winning the claim and writing the booking, the retry recognises its own claim
            // instead of treating the credit as taken by someone else and losing the money.
            const token = fixedToken || ('pos-' + (window.checkoutTableID||'?') + '-' + Date.now() + '-' + Math.random().toString(36).slice(2,6));
            db.ref('payments/claims/' + ref).transaction(
                curr => (curr === null ? token : undefined),   // claim only if unclaimed, else abort
                (err, committed, snap) => { cb(!err && committed && snap && snap.val() === token); }
            );
        }
        function autoConfirmUPI(info){
            if (window.upiSettling) return;
            window.upiSettling = true; stopUPIWatch();
            window.upiMatchedInfo = info;
            setUPIStatus('verified', info);
            if (navigator.vibrate) navigator.vibrate([60,40,120]);
            setTimeout(() => settleUPI(info), 900);   // let the cashier see the tick before the modal closes
        }
        function settleUPI(info){
            const tableID = window.checkoutTableID;
            const tableData = window.activeTables[tableID];
            if (!tableData){ closeModal('upi-modal'); return; }
            const amountToPay = parseFloat(window.pendingUPIAmount) || 0;
            const total = parseFloat(tableData.total) || 0;

                payId: payId,

                    if (window.upiSettling) return;
                    if (i >= cand.length){ window.upiSettling = true; stopUPIWatch(); settleUPI(null); return; }   // nothing claimable → manual unverified
                    claimPayment(cand[i].key, cand[i].p, won => {
                        if (won && !window.upiSettling){ window.upiSettling = true; stopUPIWatch(); const p = cand[i].p; settleUPI({ ref:cand[i].key, payer:p.payer||null, amount:p.amount, source:p.source||null }); }

        function addLedgerEntry(type, amount, reason, meta) {
            const parsedAmount = parseFloat(amount) || 0;
            const timeString = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            // Each entry is its own child — push() never touches siblings and merges cleanly
            // after an offline spell. `meta` (UPI only) carries the stable payId, verification
            // state ('verified' | 'unverified'), the matched credit ref, and the bank/acct the
            // payment was routed to — so a late bank email can flip unverified→verified later.
            const entry = {
                date: timeString, type: type, amount: parsedAmount, reason: reason,
                ts: firebase.database.ServerValue.TIMESTAMP
            };
            if (meta && typeof meta === 'object') {
                if (meta.payId) entry.payId = meta.payId;
                if (meta.state) entry.state = meta.state;               // 'verified' | 'unverified'
                if (meta.ref) entry.ref = meta.ref;                     // matched bank credit ref
                if (meta.bankTag) entry.bankTag = meta.bankTag;         // VPA's admin bank tag, e.g. "yes 8020"
                if (meta.tip) entry.tip = parseFloat(meta.tip) || 0;    // part of amount, not extra revenue
            }
            db.ref('pos/ledgerEntries').push(entry);

            // Running totals via atomic increment — concurrent sales can't lose each other,
            // it shows instantly, and reconciles correctly after reconnect.
            if (type === 'cash_income') {
                db.ref('pos/cashDrawer').set(firebase.database.ServerValue.increment(parsedAmount));
            } else if (type === 'upi_income') {
                db.ref('pos/upiTotal').set(firebase.database.ServerValue.increment(parsedAmount));
            } else {
                db.ref('pos/cashDrawer').set(firebase.database.ServerValue.increment(-parsedAmount));
            }
        }

        // ===== LEDGER VERIFICATION RECONCILER =====
        // Late bank emails (esp. Yes Bank) can land minutes after a payment is settled
        // manually. This keeps a live cache of recent credits and, on any change to either
        // credits or the ledger, tries to match each still-unverified UPI entry. A match
        // flips that entry to verified (the ✓ appears on its own).
        // TWO SOURCES, because the last bills of the night used to be unfixable: EOD deletes
        // pos/ledgerEntries, and the reconciler only runs inside a live session — so a bank
        // email arriving after closing had nothing left to match against. EOD now parks any
        // still-unverified payment in pos/unverified before wiping, and this sweeps that node
        // too, on a much longer window, every time the POS is opened.
        // GUARD: only auto-verifies when the match is UNAMBIGUOUS (exactly one unverified
        // entry fits that amount+bank); ambiguous cases wait for admin, never guess.
        window._reconCredits = {}; window._reconFeed = false; window._carryUnverified = {};
        function startVerificationReconciler(){
            if (window._reconFeed) return; window._reconFeed = true;
            try { db.ref('upiRouting/config').once('value', s => { window._upiCfgCache = s.val() || {}; }); } catch(e){}
            try {
                db.ref('payments/incoming').orderByChild('at').limitToLast(120).on('value', s => {
                    window._reconCredits = s.val() || {};
                    try { reconcileLedgerVerification(); } catch(e){}
                });
            } catch(e){}
            try {
                db.ref('pos/unverified').on('value', s => {
                    window._carryUnverified = s.val() || {};
                    try { reconcileLedgerVerification(); } catch(e){}
                });
            } catch(e){}
        }
        function reconcileLedgerVerification(){
            const ledger = window.salesLedgerMap || {};
            const credits = window._reconCredits || {};
            if (!Object.keys(ledger).length || !Object.keys(credits).length) return;
            const now = serverNow();
            // TWO SEPARATE THINGS. Conflating them is what stopped the last bills of a session
            // from ever verifying: the POS is closed when the email lands, so nothing runs until
            // the next morning — and an AGE filter then discarded the entry before its credit was
            // ever compared to it, even though the two were minutes apart.
            //   ENTRY_AGE  — how long an unresolved entry stays eligible. Generous: an entry
            //                sitting in the live ledger is unresolved by definition.
            //   PROXIMITY  — how close the credit must be to the settlement. Tight: this is what
            //                makes a match trustworthy, and it alone stops a days-old entry from
            //                grabbing a fresh credit.
            const ENTRY_AGE = 7*24*60*60000;
            const CARRY_AGE = 5*24*60*60000;
            const PROXIMITY = 3*60*60000;

            // credits already bound to a verified entry can't be reused
            const usedRefs = new Set();
            for (const k in ledger){ const e = ledger[k]; if (e && e.state === 'verified' && e.ref) usedRefs.add(String(e.ref)); }

            const pending = [];
            for (const k in ledger){
                const e = ledger[k];
                if (!e || e.type !== 'upi_income' || e.state !== 'unverified') continue;
                if (e.ts && e.ts < now - ENTRY_AGE) continue;
                pending.push({ key: k, e: e, ts: e.ts || 0, src: 'ledger', win: PROXIMITY });
            }
            // parked at EOD — these outlive the ledger they came from
            const carry = window._carryUnverified || {};
            for (const pid in carry){
                const c = carry[pid]; if (!c || c.state === 'verified') continue;
                if (c.ts && c.ts < now - CARRY_AGE) continue;
                if (c.ref) usedRefs.add(String(c.ref));
                pending.push({ key: pid, ts: c.ts || 0, src: 'carry', win: PROXIMITY,
                               e: { type: 'upi_income', state: 'unverified', amount: c.amount, bankTag: c.bankTag || null } });
            }
            if (!pending.length) return;

            function tagOf(e){ const t = e.bankTag || null; if (!t) return { bankTag:null, acctTag:null, raw:null }; const parts = String(t).trim().toLowerCase().split(/\s+/); return { bankTag: parts[0], acctTag: parts[1] || null, raw: String(t).trim().toLowerCase() }; }
            function creditFits(entryTag, entryTs, p, win){
                win = win || PROXIMITY;
                if (Math.abs((parseFloat(p.amount)||0) - (parseFloat(entryTag.amt)||0)) >= 0.5) return false;
                if (entryTag.bankTag && p.bank && entryTag.bankTag !== String(p.bank).trim().toLowerCase()) return false;
                if (entryTag.acctTag && p.acct && String(entryTag.acctTag) !== String(p.acct)) return false;
                const at = p.at || 0;
                if (at && Math.abs(at - entryTs) > win) return false;   // credit must be near the settlement in time
                return true;
            }

            // MATCH IN GROUPS, NOT ONE BY ONE.
            // The old rule demanded exactly one candidate credit per entry. Two bills of the
            // SAME amount to the same account break that: both credits fit both entries, so
            // every entry sees two candidates and none is ever verified. Two ₹450 sales in one
            // evening could therefore never auto-verify, no matter how promptly the bank mailed.
            // Individually those payments are indistinguishable — but in aggregate they are not
            // ambiguous at all: N entries and N matching credits pair up, whichever way round,
            // and the ledger is correct either way. Pair them in time order. Refuse only when
            // the counts DON'T line up, which is the genuinely unresolvable case.
            const groups = {};
            for (const item of pending){
                const t = tagOf(item.e); t.amt = parseFloat(item.e.amount) || 0;
                const gk = t.amt.toFixed(2) + '|' + (t.raw || '');
                if (!groups[gk]) groups[gk] = { tag: t, items: [] };
                groups[gk].items.push(item);
            }

            const updates = {};
            for (const gk in groups){
                const g = groups[gk];
                const ents = g.items.slice().sort((a,b) => a.ts - b.ts);

                // unused credits that fit at least one entry in this group
                const cands = [];
                for (const ref in credits){
                    if (usedRefs.has(String(ref))) continue;
                    const p = credits[ref]; if (!p) continue;
                    if (ents.some(it => creditFits(g.tag, it.ts, p, it.win))) cands.push({ ref: ref, p: p, at: p.at || 0 });
                }
                if (!cands.length) continue;
                // counts must line up — 2 entries and 1 credit stays ambiguous, as does 1 and 2
                if (cands.length !== ents.length) continue;

                cands.sort((a,b) => a.at - b.at);
                // every pairing must still stand on its own proximity check
                let ok = true;
                for (let i = 0; i < ents.length; i++){
                    if (!creditFits(g.tag, ents[i].ts, cands[i].p, ents[i].win)) { ok = false; break; }
                }
                if (!ok) continue;

                for (let i = 0; i < ents.length; i++){
                    const item = ents[i], cand = cands[i];
                    usedRefs.add(String(cand.ref));
                    const base = (item.src === 'carry') ? ('pos/unverified/' + item.key) : ('pos/ledgerEntries/' + item.key);
                    updates[base + '/state'] = 'verified';
                    updates[base + '/ref'] = String(cand.ref);
                    updates[base + '/lateVerified'] = true;
                    try { claimPayment(cand.ref, cand.p, function(){}); } catch(e){}
                }
            }
            if (Object.keys(updates).length){ try { db.ref().update(updates); } catch(e){} }
        }

        function renderLedger() {
            const list = document.getElementById('ledger-list'); list.innerHTML = "";
            if (window.salesLedger.length === 0) { list.innerHTML = "<p style='opacity:0.5;'>No logs.</p>"; return; }
            window.salesLedger.forEach(entry => {
                let colorClass = 'ledger-out'; let sign = '-'; let typeTag = '';
                if (entry.type === 'cash_income') { colorClass = 'ledger-income'; sign = '+'; typeTag = 'CASH: '; } 
                else if (entry.type === 'upi_income') { colorClass = 'ledger-income'; sign = '+'; typeTag = 'UPI: '; }
                else if (entry.type === 'void_upi' || entry.type === 'void_cash') { colorClass = 'ledger-out'; sign = '−'; typeTag = 'VOID: '; }
                else if (entry.type === 'refund_upi') { colorClass = 'ledger-out'; sign = '−'; typeTag = 'REFUND: '; }
                else if (entry.type === 'tip_payout') { colorClass = 'ledger-out'; sign = '−'; typeTag = 'TIPS OUT: '; }
                
                let safeAmount = Math.abs(parseFloat(entry.amount) || 0);   // stored negative for voids; sign handled above
                let tick = '';
                if (entry.type === 'upi_income') {
                    const rv = (window.upiReviewMap || {})[entry.payId] || null;
                    const adminVerified = rv && rv.state === 'verified';
                    const adminIgnored = rv && rv.state === 'ignored';
                    // ✓ when a bank credit matched (entry.state) OR an admin marked it verified.
                    // Ignore never shows a ✓ in the POS — an ignored-but-unverified payment keeps
                    // its ⏳ here on purpose, so the counter never learns that settling without
                    // proof gets quietly cleared.
                    if (entry.state === 'verified' || adminVerified) {
                        tick = '<span title="Verified" style="color:#7CFC9A; font-weight:bold; margin-left:6px;">✓</span>';
                    } else if (entry.state === 'unverified' && !adminIgnored) {
                        tick = '<span title="Not yet verified by a bank credit" style="color:#ffd54f; margin-left:6px;">⏳</span>';
                    } else if (entry.state === 'unverified' && adminIgnored) {
                        tick = '<span title="Awaiting verification" style="color:#ffd54f; margin-left:6px;">⏳</span>';
                    }
                }
                list.innerHTML += `<div class="ledger-item"><div><span style="font-weight:bold;">${typeTag}</span><span>${escapeHTML(entry.reason)}</span>${tick}<span class="ledger-meta">${entry.date}</span></div><div class="${colorClass}">${sign}₹${Math.round(safeAmount)}</div></div>`;
            });
        }

            const pinStr = prompt("Enter PIN:"); if (!pinStr) return;
            const staffName = window.staffPins[await hashPin(pinStr)]; if (!staffName) return alert("Invalid PIN.");
            if (Object.keys(window.activeTables).length > 0) { if(!confirm("Tables open. End day?")) return; }
            const _tipDue = Math.max(0, ((window.tipPool && window.tipPool.accrued) || 0) - ((window.tipPool && window.tipPool.paidOut) || 0));
            if (_tipDue > 0 && !confirm('\u20b9' + Math.round(_tipDue) + ' of tips has not been paid out yet.\n\nClose the day anyway? (It stays owed and will still be there tomorrow.)')) return;
            
            let safeUPI = parseFloat(window.upiTotal) || 0;
            let safeCash = parseFloat(window.cashDrawer) || 0;

            // Tips arrive inside the UPI total, so state them separately — otherwise the day's
            // sales figure is overstated by whatever the customers were generous with.
            const tipAcc = (window.tipPool && window.tipPool.accrued) || 0;
            const tipPaid = (window.tipPool && window.tipPool.paidOut) || 0;
            const tipDue = Math.max(0, tipAcc - tipPaid);
            let report = `ILA - EOD\nBy: ${staffName}\nDate: ${new Date().toLocaleDateString()}\n\nUPI: ₹${Math.round(safeUPI)}\nCash: ₹${Math.round(safeCash)}\n`;
            if (tipAcc > 0) report += `\nTips collected: ₹${Math.round(tipAcc)}\nSales excl. tips: ₹${Math.round(safeUPI - tipAcc)}\n` + (tipDue > 0 ? `Tips still to pay out: ₹${Math.round(tipDue)}\n` : `Tips paid out: ₹${Math.round(tipPaid)}\n`);
            report += `\nEXPENSES:\n`;
            // Reversals (voids, refunds) are stored NEGATIVE. Printing them as expenses gave
            // "- \u20b9-450", and they distorted the expense figure. Report them separately.
            const REVERSALS = { void_upi: 1, void_cash: 1, refund_upi: 1 };
            let exp = false; window.salesLedger.forEach(e => { if (e.type !== 'cash_income' && e.type !== 'upi_income' && !REVERSALS[e.type]) { report += `- \u20b9${Math.abs(parseFloat(e.amount) || 0)} | ${e.reason}\n`; exp = true; } });
            if (!exp) report += `None.\n`;
            let rev = false, revStr = '';
            window.salesLedger.forEach(e => { if (REVERSALS[e.type]) { revStr += `- \u20b9${Math.abs(parseFloat(e.amount) || 0)} | ${e.reason}\n`; rev = true; } });
            if (rev) report += `\nVOIDS & REFUNDS:\n` + revStr;
            if (confirm("Close the day? Today's sales will be archived and the till reset for tomorrow.")) {
                const todayKey = new Date().toISOString().slice(0, 10);
                // Snapshot the whole day BEFORE wiping, so nothing is lost if the WhatsApp
                // hand-off fails. Then clear the live nodes for the new day.
                // Fold each UPI payment's verification state (verified / ignored + note) into the
                // archived ledger, so the audit trail survives EOD permanently and ignored payments
                // can be investigated later. Without this the review data would orphan (upiReview
                // keys reference ledger entries that no longer exist after the wipe).
                const reviewMap = window.upiReviewMap || {};
                const enrichedLedger = (window.salesLedger || []).map(function(e){
                    if (e.type !== 'upi_income') return e;
                    const rv = e.payId ? reviewMap[e.payId] : null;
                    let vstate;
                    if (rv && rv.state === 'ignored') vstate = 'ignored';
                    else if (rv && rv.state === 'verified') vstate = 'verified-admin';
                    else if (e.state === 'verified') vstate = 'verified-bank';
                    else vstate = 'unverified';
                    const out = Object.assign({}, e, { verifyState: vstate });
                    if (rv && rv.note) out.verifyNote = rv.note;
                    if (rv && rv.by) out.verifyBy = rv.by;
                    return out;
                });
                db.ref('pos/eodArchive/' + todayKey + '-' + Date.now()).set({
                    report: report, upi: safeUPI, cash: safeCash,
                    bills: window.pastBills, ledger: enrichedLedger,
                    closedBy: staffName, closedAt: firebase.database.ServerValue.TIMESTAMP
                }).then(() => {
                    // Park anything still unverified BEFORE wiping. This is the only reason the
                    // last bills of the night can ever auto-verify: their ledger rows are about
                    // to be deleted, and the bank email may not have arrived yet. Money is not
                    // moved or recounted here — the day's totals are already archived. This is
                    // purely so a late credit can still find the payment it belongs to.
                    try {
                        const carry = {};
                        const rvMap = window.upiReviewMap || {};
                        (window.salesLedger || []).forEach(function(e){
                            if (!e || e.type !== 'upi_income' || !e.payId) return;
                            if (e.state === 'verified') return;
                            const rv = rvMap[e.payId];
                            if (rv && (rv.state === 'verified' || rv.state === 'ignored')) return;
                            carry[e.payId] = {
                                amount: parseFloat(e.amount) || 0, reason: e.reason || '',
                                ts: e.ts || 0, bankTag: e.bankTag || null,
                                day: todayKey, state: 'unverified'
                            };
                        });
                        if (Object.keys(carry).length) db.ref('pos/unverified').update(carry);
                    } catch(e){ console.error('EOD carry-forward', e); }

                    db.ref('pos/ledgerEntries').remove();
                    db.ref('pos/bills').remove();
                    // cashDrawer is NOT reset — physical cash carries forward to the next day.
                    db.ref('pos/upiTotal').set(0);
                    db.ref('pos/activeTables').remove();
                });
                var _eodBills = Array.isArray(window.pastBills) ? window.pastBills.length : 0;
                var _eodExp = 0; (window.salesLedger || []).forEach(function(e){ if (e.type !== 'cash_income' && e.type !== 'upi_income' && !REVERSALS[e.type]) _eodExp += Math.abs(parseFloat(e.amount) || 0); });
                // IMPORTANT: await the push so it actually completes before we navigate to WhatsApp.
                // (Previously this was fire-and-forget and the wa.me redirect 300ms later aborted the
                //  in-flight Firebase read + Worker POST, so the EOD notification usually never sent.)
                await posSendPush({ title: '\ud83d\udccb EOD \u2014 ' + staffName, body: 'UPI \u20b9' + Math.round(safeUPI) + ' \u00b7 Cash \u20b9' + Math.round(safeCash) + ' \u00b7 ' + _eodBills + ' bills' + (_eodExp ? ' \u00b7 Exp \u20b9' + Math.round(_eodExp) : ''), tag: 'eod', url: '/admin.html' });
                window.activeTables = {}; window.upiTotal = 0; window.salesLedger = []; window.pastBills = [];
                closeModal('cash-modal');
                window.location.href = `https://wa.me/${OWNER_WHATSAPP}?text=${encodeURIComponent(report)}`;
            }
        };

        window.openMoveTable = function() {
            const grid = document.getElementById('move-table-grid');
            grid.innerHTML = "";
            for (let i = 1; i <= 10; i++) {
                const isOccupied = window.activeTables[i.toString()] ? 'occupied' : '';
                grid.innerHTML += `<button class="table-btn ${isOccupied}" onclick="window.confirmMoveTable('${i}')">${i}</button>`;
            }
            closeModal('checkout-modal'); 
            document.getElementById('move-table-modal').classList.add('active');
        };

        window.confirmMoveTable = function(newTableID) {
            const oldTableID = window.checkoutTableID;
            if (newTableID === oldTableID) {
                closeModal('move-table-modal'); window.openCheckout(oldTableID); return;
            }
            
            if (window.activeTables[newTableID] && !confirm(`Table ${newTableID} is already occupied. Merge bills?`)) return;

            // 1. Shift the POS Data
            const tableData = window.activeTables[oldTableID];
            if (window.activeTables[newTableID]) {
                let existing = window.activeTables[newTableID];
                existing.total = (parseFloat(existing.total) || 0) + (parseFloat(tableData.total) || 0);
                existing.paid = (parseFloat(existing.paid) || 0) + (parseFloat(tableData.paid) || 0);
                if (tableData.notes) existing.notes = existing.notes ? existing.notes + " | " + tableData.notes : tableData.notes;
                
                for (let item in tableData.items) {
                    if (existing.items[item]) existing.items[item].qty += tableData.items[item].qty;
                    else existing.items[item] = tableData.items[item];
                }
            } else {
                window.activeTables[newTableID] = tableData;
            }
            delete window.activeTables[oldTableID];

            // Persist BOTH sides of the move in ONE atomic write: save the moved/merged
            // table AND remove the old one together, so the live 'pos/activeTables' listener
            // always rebuilds from a consistent state. (The previous code synced only the
            // removed table, so the moved order was never written to the cloud and the
            // listener then wiped it from this device too.)
            const movedData = window.activeTables[newTableID] || null;
            const moveUpdates = {};
            moveUpdates['pos/activeTables/' + newTableID] = movedData;
            moveUpdates['pos/activeTables/' + oldTableID] = null;
            db.ref().update(moveUpdates).catch(e => console.error("Move sync error: ", e));

            // 2. Silently Hunt and Update KDS Tickets
            const oldDest = oldTableID === 'Takeaway' ? 'Takeaway' : 'Table ' + oldTableID;
            const newDest = newTableID === 'Takeaway' ? 'Takeaway' : 'Table ' + newTableID;

            ['chef', 'barista'].forEach(station => {
                db.ref(`orders/active/${station}`).once('value', snap => {
                    const tickets = snap.val();
                    if (tickets) {
                        for (let id in tickets) {
                            if (tickets[id].destination === oldDest) {
                                db.ref(`orders/active/${station}/${id}`).update({ destination: newDest });
                            }
                        }
                    }
                });
            });

            // 3. Reset the visual state
            closeModal('move-table-modal');
            window.openCheckout(newTableID);
        };

        updateCartUI();
    </script>
</body>
</html>
