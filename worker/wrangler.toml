name = "ila-push"
main = "worker.js"

# Matched to the live Worker: the dashboard (ila-push → Settings → Runtime) reads
# 2026-06-17, which is also the Worker's creation date — Cloudflare defaults a new
# Worker's compatibility date to the day it was made.
#
# Do not change this casually. The compatibility date decides which runtime
# behaviours this code gets, so moving it can alter the email parsing and the
# payment path without a line of code changing. It was briefly committed as
# 2025-06-17, a year adrift; deploying that would have rolled the runtime back
# twelve months.
compatibility_date = "2026-06-17"

# These two were set in the dashboard and are repeated here because a deploy
# makes this file authoritative: the first deploy from it silently turned
# observability OFF and preview URLs ON, which is exactly the kind of drift a
# config file is supposed to prevent rather than cause.
#
# Logging is not optional here — the email ingest logs its failing stage on
# purpose, so that a bank changing its alert format can be diagnosed by tailing
# the Worker rather than by guessing.
preview_urls = false

[observability]
enabled = true
redact_query_string = false

[observability.logs]
enabled = true

# Cron triggers. worker.js branches on the matched schedule string, so these two
# expressions are load-bearing — "0 20 1 * *" is compared literally in scheduled().
#
# ⚠️ `wrangler deploy` makes this list authoritative: any cron configured in the
# dashboard but absent here is REMOVED. Check the dashboard's Triggers tab against
# this list before the first deploy.
[triggers]
crons = [
  "0 20 1 * *",   # monthly, 20:00 UTC on the 1st — ETA model recalibration
  "0 * * * *"     # hourly — UPI verification monitor (+ weekly digest on Mondays 04:00 UTC)
]

